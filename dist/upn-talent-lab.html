    return h`
      ${C.pageHead('Hola, ' + u.nombre.split(' ')[0] + ' 👋', (u.razonSocial || '') + ' · ' + u.distrito,
        h`<a class="btn btn--primary" href="#/reto/nuevo">${C.icono('mas', 18)} Publicar un reto</a>`)}

      ${porEvaluar.length ? h`<div style="margin-bottom:1rem">${C.aviso('warn', '⭐',
        raw('Tienes ' + porEvaluar.length + ' ' + U.plural(porEvaluar.length, 'entrega') + ' esperando tu evaluación. ' +
        '<a href="#/proyecto/' + U.esc(porEvaluar[0].id) + '?tab=evaluacion"><b>Evaluar ahora</b></a>'))}</div>` : ''}
      ${borradores.length ? h`<div style="margin-bottom:1rem">${C.aviso('brand', '📝',
        raw('Tienes ' + borradores.length + ' ' + U.plural(borradores.length, 'reto') + ' sin enviar a revisión. ' +
        '<a href="#/reto/' + U.esc(borradores[0].id) + '"><b>Continuar</b></a>'))}</div>` : ''}

      <div class="grid grid--stats">
        ${C.stat('Retos publicados', mios.filter(function (r) { return ['publicado', 'en_seleccion'].indexOf(r.estado) !== -1; }).length, 'recibiendo postulaciones', true)}
        ${C.stat('Proyectos activos', activos.length, 'en ejecución ahora')}
        ${C.stat('Proyectos cerrados', proys.filter(function (p) { return p.estado === 'cerrado'; }).length, 'con entregable recibido')}
        ${C.stat('Estudiantes UPN', U.unique([].concat.apply([], proys.map(function (p) { return p.estudianteIds; }))).length, 'han trabajado contigo')}
      </div>

      <div class="split mt">
        <div>
          <h2>Mis proyectos</h2>
          ${proys.length ? h`<div class="grid grid--2 mt-sm">${U.sortBy(proys, function (p) { return p.inicio; }, true).map(C.cardProyecto)}</div>`
            : C.vacio('🚀', 'Todavía no tienes proyectos', 'Cuando la UPN conforme el equipo para uno de tus retos, aparecerá aquí.')}

          <h2 class="mt">Mis retos</h2>
          ${mios.length ? h`<div class="panel"><ul class="list">${U.sortBy(mios, function (r) { return r.creado; }, true).map(filaReto)}</ul></div>`
            : C.vacio('📋', 'Aún no publicas ningún reto', 'Cuéntanos qué necesitas resolver y la UPN te propondrá un equipo.',
                h`<a class="btn btn--primary" href="#/reto/nuevo">Publicar mi primer reto</a>`)}
        </div>
        <div class="stack">
          <div class="card card--accent">
            <h3>¿Qué puedo pedir?</h3>
            <p class="small muted">Un reto funciona cuando es concreto y cabe en 2 a 4 semanas.</p>
            <ul class="small muted" style="margin-bottom:0">
              <li>Reactivar redes sociales y crear contenido</li>
              <li>Ordenar el inventario o un proceso</li>
              <li>Calcular costos y fijar precios</li>
              <li>Armar una web o catálogo simple</li>
              <li>Diseñar identidad de marca y etiquetas</li>
              <li>Construir un tablero de ventas</li>
            </ul>
          </div>
          ${tarjetaPerfilEmpresa(u)}
        </div>
      </div>`;
  };

  function tarjetaPerfilEmpresa(u) {
    return h`<div class="card">
      <div class="card__head">${C.avatar(u, 'avatar--lg')}
        <div class="hcol"><h3 class="card__title">${u.razonSocial || u.nombre}</h3>
          <p class="tiny muted mb0">${u.sector || ''}</p></div></div>
      <p class="small muted">${U.truncar(u.descripcion || 'Completa la descripción de tu negocio para que los estudiantes te conozcan.', 150)}</p>
      <a class="btn btn--ghost btn--sm btn--block" href="#/perfil">Editar datos de la empresa</a>
    </div>`;
  }

  function filaReto(r) {
    var post = M.postulacionesDe(r.id).length;
    return h`<li><a class="listitem" href="#/reto/${r.id}">
      <span class="avatar avatar--sm" aria-hidden="true">${M.categoria(r.categoria).icono}</span>
      <span class="listitem__main">
        <span class="listitem__t">${r.titulo}</span>
        <span class="listitem__s">${r.codigo} · ${r.semanas} semanas${post ? ' · ' + post + ' ' + U.plural(post, 'postulante') : ''}</span>
      </span>
      <span class="listitem__end">${C.chipReto(r)}</span>
    </a></li>`;
  }

  /* ================= Catálogo de retos ================= */
  Vistas.retos = function (p, q) {
    var u = Auth.actual();
    var rol = u ? u.rol : null;
    if (rol === 'empresa') return retosEmpresa(u, q);
    if (rol === 'coordinador') return retosCoordinacion(q);
    return retosCatalogo(u, q);
  };

  function filtros(q, opciones) {
    return h`<form class="searchbar" data-action="filtro:retos">
      <input class="input" type="search" name="q" value="${q.q || ''}" placeholder="Buscar por palabra clave…" aria-label="Buscar retos">
      <select class="select" name="cat" aria-label="Área">
        <option value="">Todas las áreas</option>
        ${Object.keys(CFG.CATEGORIAS).map(function (k) {
          return raw('<option value="' + k + '"' + (q.cat === k ? ' selected' : '') + '>' + U.esc(CFG.CATEGORIAS[k].label) + '</option>');
        })}
      </select>
      <select class="select" name="dur" aria-label="Duración">
        <option value="">Cualquier duración</option>
        ${[2, 3, 4].map(function (n) {
          return raw('<option value="' + n + '"' + (String(q.dur) === String(n) ? ' selected' : '') + '>' + n + ' semanas</option>');
        })}
      </select>
      ${opciones || ''}
      <button class="btn btn--ghost" type="submit">${C.icono('lupa', 16)} Filtrar</button>
    </form>`;
  }

  function aplicaFiltro(r, q) {
    if (q.q && !(U.contiene(r.titulo, q.q) || U.contiene(r.problema, q.q) || U.contiene(M.empresaNombre(r.empresaId), q.q))) return false;
    if (q.cat && r.categoria !== q.cat) return false;
    if (q.dur && String(r.semanas) !== String(q.dur)) return false;
    return true;
  }

  function retosCatalogo(u, q) {
    var esEstudiante = u && u.rol === 'estudiante';
    var lista = Store.where('retos', function (r) {
      return ['publicado'].indexOf(r.estado) !== -1 && aplicaFiltro(r, q);
    });
    var conMatch = esEstudiante
      ? U.sortBy(lista.map(function (r) { return { reto: r, match: Matching.evaluar(u, r) }; }), function (x) { return x.match.total; }, true)
      : lista.map(function (r) { return { reto: r, match: null }; });

    return h`
      ${C.pageHead(esEstudiante ? 'Oportunidades para ti' : 'Retos abiertos',
        esEstudiante ? 'Ordenados por tu compatibilidad. El porcentaje considera tus habilidades, tu disponibilidad y tu carrera.'
                     : lista.length + ' ' + U.plural(lista.length, 'reto') + ' de empresas esperando equipo.')}
      ${esEstudiante && M.tieneProyectoActivo(u.id)
        ? C.aviso('info', 'ℹ️', 'Ya tienes un microproyecto en curso. Podrás postular a otro reto cuando lo cierres.') : ''}
      ${filtros(q)}
      ${conMatch.length
        ? h`<div class="grid grid--auto">${conMatch.map(function (x) { return C.cardReto(x.reto, { match: x.match }); })}</div>`
        : C.vacio('🔍', 'No hay retos con esos filtros', 'Prueba quitando algún filtro o busca otra palabra.',
            h`<a class="btn btn--ghost" href="#/retos">Ver todos</a>`)}`;
  }

  function retosEmpresa(u, q) {
    var mios = Store.where('retos', function (r) { return r.empresaId === u.id && aplicaFiltro(r, q); });
    var grupos = U.groupBy(mios, 'estado');
    var orden = ['borrador', 'observado', 'en_revision', 'publicado', 'en_seleccion', 'en_ejecucion', 'finalizado', 'rechazado', 'cancelado'];
    return h`
      ${C.pageHead('Mis retos', mios.length + ' ' + U.plural(mios.length, 'reto') + ' en total',
        h`<a class="btn btn--primary" href="#/reto/nuevo">${C.icono('mas', 18)} Publicar un reto</a>`)}
      ${filtros(q)}
      ${mios.length ? orden.filter(function (e) { return grupos[e]; }).map(function (e) {
        return h`<h2 style="font-size:1rem;margin-top:1.2rem">${CFG.RETO_ESTADOS[e].label} <span class="chip">${grupos[e].length}</span></h2>
          <div class="panel"><ul class="list">${grupos[e].map(filaReto)}</ul></div>`;
      }) : C.vacio('📋', 'Sin retos', 'Publica tu primera necesidad y la UPN te propondrá un equipo.',
        h`<a class="btn btn--primary" href="#/reto/nuevo">Publicar un reto</a>`)}`;
  }

  function retosCoordinacion(q) {
    var estado = q.estado || 'todos';
    var todos = Store.where('retos', function (r) { return aplicaFiltro(r, q); });
    var lista = estado === 'todos' ? todos : todos.filter(function (r) { return r.estado === estado; });
    var cuenta = function (e) { return Store.where('retos', function (r) { return r.estado === e; }).length; };
    var tabs = [
      { k: 'todos', l: 'Todos', n: todos.length },
      { k: 'en_revision', l: 'Por revisar', n: cuenta('en_revision') },
      { k: 'publicado', l: 'Publicados', n: cuenta('publicado') },
      { k: 'en_seleccion', l: 'En selección', n: cuenta('en_seleccion') },
      { k: 'en_ejecucion', l: 'En ejecución', n: cuenta('en_ejecucion') },
      { k: 'finalizado', l: 'Finalizados', n: cuenta('finalizado') }
    ];
    return h`
      ${C.pageHead('Retos del programa', 'Revisa, publica y da seguimiento a todos los retos.',
        h`<a class="btn btn--primary" href="#/reto/nuevo">${C.icono('mas', 18)} Nuevo reto</a>`)}
      <div class="tabs">${tabs.map(function (t) {
        return h`<a class="tab ${estado === t.k ? 'is-on' : ''}" href="#/retos?estado=${t.k}">${t.l} ${t.n ? raw('<span class="chip tiny">' + t.n + '</span>') : ''}</a>`;
      })}</div>
      ${filtros(q, raw('<input type="hidden" name="estado" value="' + U.esc(estado) + '">'))}
      ${lista.length ? h`<div class="panel"><ul class="list">${U.sortBy(lista, function (r) { return r.creado; }, true).map(function (r) {
        var post = M.postulacionesDe(r.id).length;
        return h`<li><a class="listitem" href="#/reto/${r.id}">
          ${C.avatar(M.usuario(r.empresaId))}
          <span class="listitem__main">
            <span class="listitem__t">${r.titulo}</span>
            <span class="listitem__s">${M.empresaNombre(r.empresaId)} · ${r.codigo} · ${r.semanas} sem${post ? ' · ' + post + ' postulantes' : ''}</span>
          </span>
          <span class="listitem__end">${C.chipReto(r)}</span>
        </a></li>`;
      })}</ul></div>` : C.vacio('📭', 'Nada por aquí', 'No hay retos en este estado.')}`;
  }

  /* ================= Detalle del reto ================= */
  Vistas.retoDetalle = function (p) {
    var r = M.reto(p.id);
    if (!r) return Vistas.noEncontrado('#/reto/' + p.id);
    var u = Auth.actual();
    var emp = M.usuario(r.empresaId);
    var proy = M.proyectoDeReto(r.id);
    var esDuena = u && u.rol === 'empresa' && r.empresaId === u.id;
    var esCoord = u && u.rol === 'coordinador';
    var esEst = u && u.rol === 'estudiante';
    var miPost = esEst ? M.postulacionDe(r.id, u.id) : null;
    var match = esEst ? Matching.evaluar(u, r) : null;

    /* Los retos no publicados solo los ven su empresa y la coordinación */
    if (['publicado', 'en_seleccion', 'en_ejecucion', 'finalizado'].indexOf(r.estado) === -1 && !esDuena && !esCoord) {
      return Vistas.sinPermiso(['empresa', 'coordinador']);
    }

    return h`
      ${C.volver(u && u.rol === 'empresa' ? '#/retos' : '#/retos', 'Volver a retos')}
      <div class="split split--wide mt-sm">
        <div class="stack">
          <div class="card">
            <div class="card__head">
              ${C.avatar(emp, 'avatar--lg')}
              <div class="hcol">
                <p class="tiny muted mb0">${r.codigo}</p>
                <h1 style="font-size:1.4rem;margin:.1rem 0">${r.titulo}</h1>
                <p class="small muted mb0">
                  <a href="#/perfil/${emp.id}">${emp.razonSocial || emp.nombre}</a> · ${emp.distrito} · ${emp.sector || ''}
                </p>
              </div>
            </div>
            <div class="chips">
              ${C.chipReto(r)} ${C.chipCategoria(r.categoria)}
              <span class="chip">${C.icono('reloj', 13)} ${r.semanas} semanas</span>
              <span class="chip">${r.horasSemana} h/semana</span>
              <span class="chip">${r.tamanoEquipo} ${U.plural(r.tamanoEquipo, 'vacante')}</span>
              <span class="chip">${CFG.MODALIDADES[r.modalidad]}</span>
            </div>
          </div>

          <div class="card">
            <h2 style="font-size:1.05rem">La necesidad</h2>
            <p style="white-space:pre-wrap">${r.problema}</p>
            <h2 style="font-size:1.05rem" class="mt">Qué espera recibir la empresa</h2>
            <p style="white-space:pre-wrap">${r.resultado}</p>
            ${(r.entregables || []).length ? h`
              <h2 style="font-size:1.05rem" class="mt">Entregables comprometidos</h2>
              <ul>${r.entregables.map(function (e) { return h`<li>${e}</li>`; })}</ul>` : ''}
          </div>

          <div class="card">
            <h2 style="font-size:1.05rem">Habilidades</h2>
            <p class="small muted">Las marcadas en oscuro son indispensables.</p>
            ${C.chipsHabilidades(r.habilidadesRequeridas)}
            ${(r.habilidadesDeseables || []).length ? h`
              <p class="small muted mt-sm mb0">Suman puntos, pero no son obligatorias:</p>
              ${C.chipsHabilidades(r.habilidadesDeseables)}` : ''}
          </div>

          ${(esDuena || esCoord) ? panelPostulantes(r, esCoord) : ''}
          ${(esDuena || esCoord) ? historialReto(r) : ''}
        </div>

        <div class="stack">
          ${esEst ? panelEstudiante(r, u, miPost, match) : ''}
          ${accionesReto(r, u, esDuena, esCoord, proy)}
          ${proy ? h`<div class="card">
            <h3>Proyecto en marcha</h3>
            <p class="small muted">${proy.codigo} · ${CFG.PROYECTO_ESTADOS[proy.estado].label}</p>
            ${C.medidor(M.progreso(proy), proy.estado === 'cerrado')}
            <a class="btn btn--primary btn--block mt-sm" href="#/proyecto/${proy.id}">Ver tablero del proyecto</a>
          </div>` : ''}
          <div class="card">
            <h3>Datos del reto</h3>
            <ul class="list small">
              <li style="padding:.4rem 0"><b>Duración:</b> ${r.semanas} semanas</li>
              <li style="padding:.4rem 0"><b>Dedicación:</b> ${r.horasSemana} h por semana</li>
              <li style="padding:.4rem 0"><b>Equipo:</b> ${r.tamanoEquipo} ${U.plural(r.tamanoEquipo, 'estudiante')}</li>
              <li style="padding:.4rem 0"><b>Modalidad:</b> ${CFG.MODALIDADES[r.modalidad]}</li>
              <li style="padding:.4rem 0"><b>Postulaciones hasta:</b> ${U.fecha(r.fechaLimitePostulacion)}</li>
              <li style="padding:.4rem 0"><b>Publicado:</b> ${r.publicado ? U.haceTiempo(r.publicado) : '—'}</li>
            </ul>
          </div>
        </div>
      </div>`;
  };

  function panelEstudiante(r, u, miPost, match) {
    if (miPost) {
      var etiquetas = { postulada: ['info', '📨', 'Tu postulación fue enviada. La coordinación la revisará.'],
        preseleccionada: ['warn', '⭐', 'Estás preseleccionado para este reto.'],
        seleccionada: ['ok', '🎉', '¡Fuiste seleccionado para este reto!'],
        no_seleccionada: ['danger', '💬', 'Esta vez no fuiste seleccionado. Sigue postulando a otros retos.'] };
      var e = etiquetas[miPost.estado] || etiquetas.postulada;
      return h`<div class="card">
        <h3>Tu postulación</h3>
        ${C.aviso(e[0], e[1], e[2])}
        <p class="small muted mt-sm">Enviada ${U.haceTiempo(miPost.creado)} · compatibilidad ${miPost.score}%</p>
        <blockquote class="small" style="border-left:3px solid var(--border);padding-left:.8rem;margin:.5rem 0;color:var(--text-soft)">${miPost.motivacion}</blockquote>
        ${miPost.estado === 'postulada' ? h`<button class="btn btn--ghost btn--sm btn--block"
          data-action="postulacion:retirar" data-id="${miPost.id}" data-confirm="¿Retirar tu postulación a este reto?">Retirar postulación</button>` : ''}
      </div>`;
    }

    var puede = r.estado === 'publicado' && !M.tieneProyectoActivo(u.id) && !match.descartado;
    return h`<div class="card card--accent">
      <h3>Tu compatibilidad</h3>
      <div class="row" style="gap:.75rem;margin-bottom:.5rem">
        ${C.anilloMatch(match, true)}
      </div>
      ${match.descartado ? C.aviso('warn', '⚠️', match.motivo) : ''}
      ${C.desgloseMatch(match)}
      <div class="mt-sm">
        ${puede
          ? h`<button class="btn btn--primary btn--block" data-action="postulacion:abrir" data-id="${r.id}">Postular a este reto</button>`
          : h`<button class="btn btn--block" disabled>${
              r.estado !== 'publicado' ? 'Este reto ya no recibe postulaciones'
              : (M.tieneProyectoActivo(u.id) ? 'Ya tienes un proyecto en curso' : 'No cumples los requisitos indispensables')
            }</button>`}
      </div>
    </div>`;
  }

  function accionesReto(r, u, esDuena, esCoord, proy) {
    if (!u || (!esDuena && !esCoord)) return '';
    var acciones = [];

    if (Auth.can('reto:editar', r)) acciones.push(h`<a class="btn btn--ghost btn--block" href="#/reto/${r.id}/editar">Editar reto</a>`);
    if (Auth.can('reto:enviar', r)) acciones.push(h`<button class="btn btn--primary btn--block" data-action="reto:transicion" data-id="${r.id}" data-destino="en_revision">Enviar a revisión de la UPN</button>`);
    if (esCoord && r.estado === 'en_revision') {
      acciones.push(h`<button class="btn btn--primary btn--block" data-action="reto:transicion" data-id="${r.id}" data-destino="publicado" data-confirm="¿Publicar este reto para que los estudiantes postulen?">Aprobar y publicar</button>`);
      acciones.push(h`<button class="btn btn--ghost btn--block" data-action="reto:observar" data-id="${r.id}">Devolver con observaciones</button>`);
      acciones.push(h`<button class="btn btn--ghost btn--block" data-action="reto:rechazar" data-id="${r.id}">Rechazar</button>`);
    }
    if (esCoord && r.estado === 'publicado') {
      acciones.push(h`<button class="btn btn--primary btn--block" data-action="reto:transicion" data-id="${r.id}" data-destino="en_seleccion" data-confirm="¿Cerrar postulaciones y pasar a selección de equipo?">Cerrar postulaciones</button>`);
    }
    if (esCoord && r.estado === 'en_seleccion') {
      acciones.push(h`<a class="btn btn--primary btn--block" href="#/matching/${r.id}">Conformar equipo</a>`);
    }
    if (!acciones.length) return '';

    return h`<div class="card">
      <h3>Acciones</h3>
      ${r.notasRevision && ['observado', 'rechazado'].indexOf(r.estado) !== -1
        ? C.aviso('warn', '📝', raw('<b>Observación de la coordinación:</b> ' + U.esc(r.notasRevision))) : ''}
      <div class="stack" style="gap:.5rem">${acciones}</div>
    </div>`;
  }

  function panelPostulantes(r, esCoord) {
    var lista = Matching.rankearPostulantes(r.id);
    if (!lista.length) {
      return h`<div class="card"><h2 style="font-size:1.05rem">Postulantes</h2>
        ${C.vacio('👥', 'Todavía nadie ha postulado', r.estado === 'publicado'
          ? 'El reto está publicado. Los estudiantes con habilidades afines lo verán en sus oportunidades.'
          : 'Este reto no recibió postulaciones.')}</div>`;
    }
    return h`<div class="panel">

      ${items.length ? h`<div class="stack">${items.map(function (i) {

          <div class="card__head">

            <div class="row row--between"><h2 style="margin:0">Proyectos en ejecución</h2><a class="tiny" href="#/proyectos">Ver todos</a></div>
            ${activos.length ? h`<div class="grid grid--2 mt-sm">${activos.map(C.cardProyecto)}</div>`
              : C.vacio('🚀', 'Sin proyectos activos', 'Cuando se conforme un equipo, el proyecto aparecerá aquí.')}
          </div>
        </div>

        <div class="stack">
          <div class="card">
            <h3>Impacto del programa</h3>
            <ul class="list small">
              <li style="padding:.45rem 0"><b>${mt.empresas}</b> empresas aliadas</li>
              <li style="padding:.45rem 0"><b>${mt.estudiantes}</b> estudiantes inscritos</li>
              <li style="padding:.45rem 0"><b>${mt.proyectosCerrados}</b> microproyectos cerrados</li>
              <li style="padding:.45rem 0"><b>${mt.horas}</b> horas de experiencia acreditadas</li>
              <li style="padding:.45rem 0"><b>${mt.constancias}</b> constancias vigentes</li>
              ${mt.satisfaccion !== null ? h`<li style="padding:.45rem 0"><b>${mt.satisfaccion}/100</b> evaluación promedio</li>` : ''}
            </ul>
            <a class="btn btn--ghost btn--sm btn--block" href="#/reportes">Ver reportes completos</a>
          </div>
          <div class="card">
            <h3>Carga de mentores</h3>
            ${M.mentores().map(function (m) {
              var carga = M.cargaMentor(m.id), max = m.maxProyectos || 3;
              return h`<div style="margin-bottom:.7rem">
                <div class="row row--between"><span class="small"><b>${m.nombre}</b></span><span class="tiny muted">${carga}/${max}</span></div>
                ${C.progreso(U.pct(carga, max))}
                <span class="tiny muted">${m.especialidad}</span>
              </div>`;
            })}
          </div>
        </div>
      </div>`;
  };

  function bandeja(titulo, lista, filaFn, ico, vacioTxt) {
    return h`<div class="panel">
      <div class="panel__head"><h3>${titulo}</h3>${lista.length ? h`<span class="chip chip--brand">${lista.length}</span>` : ''}</div>
      ${lista.length ? h`<ul class="list">${lista.map(filaFn)}</ul>`
        : h`<div class="panel__body center"><p class="small muted mb0">${ico} ${vacioTxt}</p></div>`}
    </div>`;
  }

  /* ================= Conformación de equipo ================= */
  Vistas.matching = function (p, q) {
    var r = M.reto(p.id);
    if (!r) return Vistas.noEncontrado('#/matching/' + p.id);
    if (r.estado !== 'en_seleccion') {
      return h`${C.volver('#/reto/' + r.id)}
        ${C.vacio('⏳', 'Este reto no está en selección',
          'El reto está en estado “' + CFG.RETO_ESTADOS[r.estado].label + '”. Cierra las postulaciones para conformar el equipo.',
          h`<a class="btn btn--primary" href="#/reto/${r.id}">Ir al reto</a>`)}`;
    }

    var sugerido = Matching.sugerirEquipo(r.id);
    var seleccion = q.sel ? q.sel.split(',').filter(Boolean) : sugerido.ids;
    var mentores = Matching.sugerirMentores(r.id);
    var mentorSel = q.mentor || (mentores[0] && mentores[0].disponible ? mentores[0].mentor.id : '');
    var cob = Matching.cobertura(r.id, seleccion);
    var ranking = Matching.rankearPostulantes(r.id);

    return h`
      ${C.volver('#/reto/' + r.id, 'Volver al reto')}
      ${C.pageHead('Conformar equipo', r.titulo + ' · ' + M.empresaNombre(r.empresaId))}

      <div class="split split--wide">
        <div class="stack">
          <div class="panel">
            <div class="panel__head">
              <h3>Postulantes ordenados por compatibilidad (${ranking.length})</h3>
              <button class="btn btn--ghost btn--sm" data-action="equipo:sugerir" data-id="${r.id}">Usar equipo sugerido</button>
            </div>
            <ul class="list">
              ${ranking.map(function (x) {
                var on = seleccion.indexOf(x.estudiante.id) !== -1;
                var ocupado = M.tieneProyectoActivo(x.estudiante.id);
                return h`<li>
                  <div class="listitem" style="align-items:flex-start">
                    <input type="checkbox" class="equipo-check" style="width:20px;height:20px;margin-top:.6rem;accent-color:var(--bronce)"
                      data-action="equipo:toggle" data-reto="${r.id}" data-id="${x.estudiante.id}"
                      ${raw(on ? 'checked' : '')} ${raw(x.match.descartado || ocupado ? 'disabled' : '')}
                      aria-label="Seleccionar a ${x.estudiante.nombre}">
                    <span class="listitem__main">
                      <span class="listitem__t"><a href="#/perfil/${x.estudiante.id}">${x.estudiante.nombre}</a>
                        ${ocupado ? raw('<span class="chip chip--warn tiny">Con proyecto activo</span>') : ''}</span>
                      <span class="listitem__s">${x.estudiante.carrera} · Ciclo ${x.estudiante.ciclo} · ${x.estudiante.horasSemana} h/sem · ${CFG.MODALIDADES[x.estudiante.modalidad]}</span>
                      ${x.match.descartado ? h`<span class="tiny" style="color:var(--danger)">${x.match.motivo}</span>` : ''}
                      <details style="margin-top:.4rem">
                        <summary class="tiny" style="cursor:pointer;color:var(--bronce);font-weight:700">Ver por qué este puntaje</summary>
                        <div style="margin-top:.4rem">${C.desgloseMatch(x.match)}</div>
                        <p class="tiny muted" style="margin-top:.5rem"><b>Motivación:</b> ${x.postulacion.motivacion}</p>
                      </details>
                    </span>
                    <span class="listitem__end">${C.anilloMatch(x.match)}</span>
                  </div>
                </li>`;
              })}
            </ul>
          </div>
        </div>

        <div class="stack">
          <form class="card" data-action="equipo:conformar">
            <input type="hidden" name="retoId" value="${r.id}">
            <input type="hidden" name="estudianteIds" value="${seleccion.join(',')}">
            <h3>Equipo seleccionado</h3>
            ${seleccion.length ? h`<ul class="list">
              ${seleccion.map(function (id, i) {
                var e = M.usuario(id);
                return h`<li style="padding:.4rem 0"><div class="row row--between">
                  ${C.persona(e, i === 0 ? 'Líder de equipo' : 'Integrante')}
                  <button type="button" class="btn btn--ghost btn--sm" data-action="equipo:toggle" data-reto="${r.id}" data-id="${id}">Quitar</button>
                </div></li>`;
              })}
            </ul>` : h`<p class="small muted">Marca a los estudiantes en la lista de la izquierda.</p>`}

            <p class="tiny muted mt-sm mb0">Cobertura de habilidades requeridas</p>
            ${C.medidor(cob.pct, cob.pct >= 80)}
            ${cob.faltantes.length ? C.aviso('warn', '⚠️', raw('Sin cubrir: <b>' +
                U.esc(cob.faltantes.map(M.habilidadNombre).join(', ')) + '</b>')) : C.aviso('ok', '✅', 'El equipo cubre todas las habilidades requeridas.')}

            <hr>
            <div class="field">
              <label for="mentorId">Docente mentor <span style="color:var(--danger)">*</span></label>
              <select class="select" id="mentorId" name="mentorId" required data-action="equipo:mentor" data-reto="${r.id}">
                <option value="">Elige un mentor…</option>
                ${mentores.map(function (m) {
                  return raw('<option value="' + U.esc(m.mentor.id) + '"' + (mentorSel === m.mentor.id ? ' selected' : '') +
                    (m.disponible ? '' : ' disabled') + '>' + U.esc(m.mentor.nombre) +
                    ' — ' + m.score + '% afinidad · ' + m.carga + '/' + m.max + ' proyectos' + (m.disponible ? '' : ' (sin cupo)') + '</option>');
                })}
              </select>
              ${mentorSel && mentores.filter(function (m) { return m.mentor.id === mentorSel; })[0]
                ? h`<p class="field__hint">Coincide en: ${(mentores.filter(function (m) { return m.mentor.id === mentorSel; })[0].coincidencias.join(', ')) || 'ninguna habilidad específica'}</p>` : ''}
            </div>
            ${C.campo({ name: 'inicio', label: 'Fecha de inicio', tipo: 'date', valor: U.sumarDias(U.hoy(), 3), required: true })}
            <p class="tiny muted">Se generarán ${r.semanas} hitos semanales automáticamente y se notificará a todos los involucrados.</p>
            <button class="btn btn--primary btn--block btn--lg" type="submit"
              ${raw(seleccion.length ? '' : 'disabled')}>Conformar equipo e iniciar proyecto</button>
          </form>

          <div class="card">
            <h3>Habilidades que pide el reto</h3>
            ${(r.habilidadesRequeridas || []).map(function (hab) {
              var cubierta = cob.cubiertas.indexOf(hab.skill) !== -1;
              return h`<div class="row row--between" style="padding:.3rem 0;border-bottom:1px solid var(--border)">
                <span class="small">${M.habilidadNombre(hab.skill)} ${hab.peso === 3 ? raw('<span class="chip chip--dark tiny">Indispensable</span>') : ''}</span>
                <span class="chip ${cubierta ? 'chip--ok' : 'chip--danger'}">${cubierta ? '✓' : '✗'}</span>
              </div>`;
            })}
          </div>
        </div>
      </div>`;
  };

  /* ================= Directorio de talento ================= */
  Vistas.talento = function (p, q) {
    var lista = M.estudiantes().filter(function (e) {
      if (q.q && !(U.contiene(e.nombre, q.q) || U.contiene(e.carrera, q.q) ||
        (e.habilidades || []).some(function (s) { return U.contiene(M.habilidadNombre(s.skill), q.q); }))) return false;
      if (q.hab && !(e.habilidades || []).some(function (s) { return s.skill === q.hab; })) return false;
      if (q.campus && e.campus !== q.campus) return false;
      return true;
    });

    return h`
      ${C.pageHead('Talento UPN', lista.length + ' ' + U.plural(lista.length, 'estudiante') + ' con habilidades declaradas')}
      <form class="searchbar" data-action="filtro:talento">
        <input class="input" type="search" name="q" value="${q.q || ''}" placeholder="Buscar por nombre, carrera o habilidad…" aria-label="Buscar estudiantes">
        <select class="select" name="hab" aria-label="Habilidad">
          <option value="">Cualquier habilidad</option>
          ${Object.keys(CFG.HABILIDADES).map(function (k) {
            return raw('<option value="' + k + '"' + (q.hab === k ? ' selected' : '') + '>' + U.esc(CFG.HABILIDADES[k].nombre) + '</option>');
          })}
        </select>
        <select class="select" name="campus" aria-label="Campus">
          <option value="">Todos los campus</option>
          ${CFG.CAMPUS.map(function (c) {
            return raw('<option value="' + U.esc(c) + '"' + (q.campus === c ? ' selected' : '') + '>' + U.esc(c) + '</option>');
          })}
        </select>
        <button class="btn btn--ghost" type="submit">Filtrar</button>
      </form>
      ${lista.length ? h`<div class="grid grid--auto">${lista.map(function (e) {
        var certs = M.constanciasDe(e.id).filter(function (c) { return c.estado === 'vigente'; });
        var rating = M.ratingEstudiante(e.id);
        return h`<a class="card card--link" href="#/perfil/${e.id}">
          <div class="card__head">${C.avatar(e, 'avatar--lg')}
            <div class="hcol">
              <h3 class="card__title">${e.nombre}</h3>
              <p class="tiny muted mb0">${e.carrera} · Ciclo ${e.ciclo}</p>
              <p class="tiny muted mb0">${e.campus}</p>
            </div>
            ${M.tieneProyectoActivo(e.id) ? h`<span class="chip chip--warn">Ocupado</span>` : h`<span class="chip chip--ok">Disponible</span>`}
          </div>
          <div class="chips">${(e.habilidades || []).slice(0, 4).map(function (s) {
            return h`<span class="chip">${M.habilidadNombre(s.skill)}</span>`; })}</div>
          <div class="card__foot">
            <span class="tiny muted">${e.horasSemana} h/sem · ${CFG.MODALIDADES[e.modalidad]}</span>
            <span class="tiny muted">${certs.length ? certs.length + ' ' + U.plural(certs.length, 'constancia') : 'Sin experiencia aún'}${rating ? ' · ' + rating + '/100' : ''}</span>
          </div>
        </a>`;
      })}</div>` : C.vacio('🔍', 'Sin resultados', 'Prueba con otra habilidad o quita los filtros.')}`;
  };

  /* ================= Reportes ================= */
  Vistas.reportes = function () {
    var mt = M.metricas();
    var retos = Store.all('retos');
    var porCategoria = U.groupBy(retos, 'categoria');
    var porEstado = U.groupBy(retos, 'estado');
    var proyectos = Store.all('proyectos');
    var maxCat = Math.max.apply(null, Object.keys(porCategoria).map(function (k) { return porCategoria[k].length; }).concat([1]));

    return h`
      ${C.pageHead('Reportes del programa', 'Indicadores de gestión de UPN Talent Lab')}
      <div class="grid grid--stats">
        ${C.stat('Retos recibidos', mt.retosTotales, 'desde el inicio', true)}
        ${C.stat('Microproyectos', proyectos.length, mt.proyectosCerrados + ' cerrados')}
        ${C.stat('Horas acreditadas', mt.horas, 'de experiencia estudiantil')}
        ${C.stat('Evaluación promedio', mt.satisfaccion !== null ? mt.satisfaccion + '/100' : '—', 'mentor y empresa')}
      </div>

      <div class="split mt">
        <div class="panel">
          <div class="panel__head"><h3>Retos por área</h3></div>
          <div class="panel__body">
            ${Object.keys(porCategoria).map(function (k) {
              var n = porCategoria[k].length;
              return h`<div style="margin-bottom:.75rem">
                <div class="row row--between"><span class="small">${M.categoria(k).icono} ${M.categoria(k).label}</span><b class="small">${n}</b></div>
                ${C.progreso(U.pct(n, maxCat))}
              </div>`;
            })}
          </div>
        </div>
        <div class="panel">
          <div class="panel__head"><h3>Retos por estado</h3></div>
          <div class="panel__body">
            <ul class="list small">
              ${Object.keys(porEstado).map(function (k) {
                return h`<li style="padding:.45rem 0"><div class="row row--between">
                  ${C.chipReto({ estado: k })}<b>${porEstado[k].length}</b></div></li>`;
              })}
            </ul>
          </div>
        </div>
      </div>

      <div class="panel mt">
        <div class="panel__head"><h3>Detalle de microproyectos</h3></div>
        <div class="table-wrap">
          <table class="tbl">
            <thead><tr><th>Código</th><th>Reto</th><th>Empresa</th><th>Equipo</th><th>Mentor</th><th>Avance</th><th>Estado</th></tr></thead>
            <tbody>
              ${proyectos.map(function (p) {
                var r = M.reto(p.retoId);
                return h`<tr>
                  <td><a href="#/proyecto/${p.id}">${p.codigo}</a></td>
                  <td>${U.truncar(r ? r.titulo : '—', 42)}</td>
                  <td>${U.truncar(M.empresaNombre(p.empresaId), 26)}</td>
                  <td>${p.estudianteIds.length}</td>
                  <td>${U.truncar(M.nombre(p.mentorId), 22)}</td>
                  <td style="min-width:110px">${C.medidor(M.progreso(p), p.estado === 'cerrado')}</td>
                  <td>${C.chipProyecto(p)}</td>
                </tr>`;
              })}
            </tbody>
          </table>
        </div>
      </div>

      <div class="panel mt">
        <div class="panel__head"><h3>Empresas participantes</h3></div>
        <div class="table-wrap">
          <table class="tbl">
            <thead><tr><th>Empresa</th><th>Rubro</th><th>Ciudad</th><th>Retos</th><th>Proyectos</th></tr></thead>
            <tbody>
              ${M.empresas().map(function (e) {
                var rs = Store.where('retos', function (r) { return r.empresaId === e.id; });
                var ps = Store.where('proyectos', function (p) { return p.empresaId === e.id; });
                return h`<tr>
                  <td><a href="#/perfil/${e.id}">${e.razonSocial || e.nombre}</a></td>
                  <td>${e.sector || '—'}</td><td>${e.distrito || '—'}</td>
                  <td>${rs.length}</td><td>${ps.length}</td>
                </tr>`;
              })}
            </tbody>
          </table>
        </div>
      </div>`;
  };
})();

/* ===== assets/js/14-views-mentor.js ===== */
/* 14-views-mentor.js — Panel del docente mentor */
window.Vistas = window.Vistas || {};
(function () {
  var h = U.html, raw = U.raw;

  Vistas.panelMentor = function (u) {
    var proys = M.proyectosDe(u.id);
    var activos = proys.filter(function (p) { return ['en_curso', 'en_validacion'].indexOf(p.estado) !== -1; });
    var porRevisar = [];
    activos.forEach(function (p) {
      (p.hitos || []).forEach(function (hi) {
        if (hi.estado === 'entregado') porRevisar.push({ proyecto: p, hito: hi });
      });
    });
    var porEvaluar = proys.filter(function (p) { return Auth.can('evaluar:mentor', p); });
    var proximos = [];
    activos.forEach(function (p) {
      (p.hitos || []).forEach(function (hi) {
        if (hi.estado === 'pendiente' || hi.estado === 'observado') {
          proximos.push({ proyecto: p, hito: hi, dias: U.diasEntre(U.hoy(), hi.fechaLimite) });
        }
      });
    });
    proximos = U.sortBy(proximos, function (x) { return x.dias; }).slice(0, 5);

    return h`
      ${C.pageHead('Hola, ' + u.nombre.split(' ')[0] + ' 👋', u.especialidad + ' · Facultad de ' + u.facultad)}

      ${porRevisar.length ? h`<div style="margin-bottom:1rem">${C.aviso('warn', '📥',
        raw('Tienes <b>' + porRevisar.length + '</b> ' + U.plural(porRevisar.length, 'hito') + ' esperando tu revisión.'))}</div>` : ''}
      ${porEvaluar.length ? h`<div style="margin-bottom:1rem">${C.aviso('brand', '⭐',
        raw('Hay <b>' + porEvaluar.length + '</b> ' + U.plural(porEvaluar.length, 'entrega') + ' final por evaluar. ' +
        '<a href="#/proyecto/' + U.esc(porEvaluar[0].id) + '?tab=evaluacion"><b>Evaluar</b></a>'))}</div>` : ''}

      <div class="grid grid--stats">
        ${C.stat('Proyectos activos', activos.length, 'de ' + (u.maxProyectos || 3) + ' posibles', true)}
        ${C.stat('Hitos por revisar', porRevisar.length, 'entregados por los equipos')}
        ${C.stat('Estudiantes', U.unique([].concat.apply([], activos.map(function (p) { return p.estudianteIds; }))).length, 'bajo tu acompañamiento')}
        ${C.stat('Proyectos cerrados', proys.filter(function (p) { return p.estado === 'cerrado'; }).length, 'con constancia emitida')}
      </div>

      <div class="split mt">
        <div class="stack">
          <div class="panel">
            <div class="panel__head"><h3>Hitos esperando revisión</h3>
              ${porRevisar.length ? h`<span class="chip chip--warn">${porRevisar.length}</span>` : ''}</div>
            ${porRevisar.length ? h`<ul class="list">${porRevisar.map(function (x) {
              var r = M.reto(x.proyecto.retoId);
              return h`<li><a class="listitem" href="#/proyecto/${x.proyecto.id}?tab=hitos">
                <span class="avatar avatar--sm" aria-hidden="true">📥</span>
                <span class="listitem__main">
                  <span class="listitem__t">${x.hito.titulo} — semana ${x.hito.semana}</span>
                  <span class="listitem__s">${r ? r.titulo : ''} · entregado ${U.haceTiempo(x.hito.entregadoAt)}</span>
                </span>
                <span class="listitem__end"><span class="chip chip--info">Revisar</span></span>
              </a></li>`;
            })}</ul>` : h`<div class="panel__body center"><p class="small muted mb0">✅ Nada pendiente por revisar</p></div>`}
          </div>

          <div>
            <h2>Proyectos que acompaño</h2>
            ${proys.length ? h`<div class="grid grid--2 mt-sm">${U.sortBy(proys, function (p) { return p.inicio; }, true).map(C.cardProyecto)}</div>`
              : C.vacio('🧭', 'Todavía no tienes proyectos asignados', 'La coordinación te asignará como mentor cuando conforme un equipo de tu área.')}
          </div>
        </div>

        <div class="stack">
          <div class="card">
            <h3>Próximos vencimientos</h3>
            ${proximos.length ? h`<ul class="timeline" style="margin-top:.5rem">
              ${proximos.map(function (x) {
                var vencido = x.dias < 0;
                return h`<li>
                  <span class="timeline__dot ${vencido ? 'timeline__dot--warn' : 'timeline__dot--now'}"></span>
                  <p class="timeline__t">${x.hito.titulo}</p>
                  <p class="timeline__m">${U.truncar(M.reto(x.proyecto.retoId).titulo, 40)}</p>
                  <p class="tiny ${vencido ? '' : 'muted'}" style="${raw(vencido ? 'color:var(--danger)' : '')}">
                    ${vencido ? 'Venció hace ' + Math.abs(x.dias) + ' días' : (x.dias === 0 ? 'Vence hoy' : 'En ' + x.dias + ' días')}
                  </p>
                </li>`;
              })}
            </ul>` : h`<p class="small muted mb0">No hay hitos próximos a vencer.</p>`}
          </div>
          <div class="card">
            <h3>Mis especialidades</h3>
            <div class="chips">${(u.habilidades || []).map(function (s) {
              return h`<span class="chip chip--brand">${M.habilidadNombre(s)}</span>`; })}</div>
            <p class="small muted mt-sm mb0">${u.bio || ''}</p>
          </div>
        </div>
      </div>`;
  };
})();

/* ===== assets/js/15-views-proyecto.js ===== */
/* 15-views-proyecto.js — Lista de proyectos y tablero de trabajo compartido por los 4 roles */
window.Vistas = window.Vistas || {};
(function () {
  var h = U.html, raw = U.raw;

  /* ================= Lista ================= */
  Vistas.proyectos = function (p, q) {
    var u = Auth.actual();
    var lista = u.rol === 'coordinador' ? Store.all('proyectos') : M.proyectosDe(u.id);
    var filtro = q.estado || 'todos';
    if (filtro !== 'todos') lista = lista.filter(function (x) { return x.estado === filtro; });
    lista = U.sortBy(lista, function (x) { return x.inicio; }, true);

    var titulos = { estudiante: 'Mis proyectos', empresa: 'Mis proyectos', mentor: 'Proyectos que acompaño', coordinador: 'Todos los proyectos' };
    var tabs = [{ k: 'todos', l: 'Todos' }, { k: 'en_curso', l: 'En curso' }, { k: 'en_validacion', l: 'En validación' },
                { k: 'aprobado', l: 'Aprobados' }, { k: 'cerrado', l: 'Cerrados' }];

    return h`
      ${C.pageHead(titulos[u.rol], lista.length + ' ' + U.plural(lista.length, 'microproyecto'))}
      <div class="tabs">${tabs.map(function (t) {
        return h`<a class="tab ${filtro === t.k ? 'is-on' : ''}" href="#/proyectos?estado=${t.k}">${t.l}</a>`;
      })}</div>
      ${lista.length ? h`<div class="grid grid--auto">${lista.map(C.cardProyecto)}</div>`
        : C.vacio('🚀', 'Sin proyectos en este estado', 'Cambia de pestaña o vuelve más tarde.')}`;
  };

  /* ================= Tablero ================= */
  Vistas.proyecto = function (p, q) {
    var proy = M.proyecto(p.id);
    if (!proy) return Vistas.noEncontrado('#/proyecto/' + p.id);
    if (!Auth.can('proyecto:ver', proy)) return Vistas.sinPermiso(['estudiante', 'empresa', 'mentor', 'coordinador']);

    var u = Auth.actual();
    var r = M.reto(proy.retoId);
    var tab = q.tab || 'resumen';
    var tabs = [
      { k: 'resumen', l: 'Resumen' },
      { k: 'hitos', l: 'Hitos', n: (proy.hitos || []).filter(function (x) { return x.estado === 'entregado'; }).length },
      { k: 'bitacora', l: 'Bitácora' },
      { k: 'entrega', l: 'Entrega final' },
      { k: 'evaluacion', l: 'Evaluación' },
      { k: 'equipo', l: 'Equipo' }
    ];

    var cuerpo = { resumen: tabResumen, hitos: tabHitos, bitacora: tabBitacora,
                   entrega: tabEntrega, evaluacion: tabEvaluacion, equipo: tabEquipo }[tab] || tabResumen;

    return h`
      ${C.volver('#/proyectos', 'Volver a proyectos')}
      <div class="card mt-sm">
        <div class="card__head">
          <span class="avatar avatar--lg" aria-hidden="true">${M.categoria(r.categoria).icono}</span>
          <div class="hcol">
            <p class="tiny muted mb0">${proy.codigo} · ${r.codigo}</p>
            <h1 style="font-size:1.35rem;margin:.1rem 0">${r.titulo}</h1>
            <p class="small muted mb0">${M.empresaNombre(proy.empresaId)} · ${U.fecha(proy.inicio)} a ${U.fecha(proy.fin)}</p>
          </div>
          ${C.chipProyecto(proy)}
        </div>
        ${C.medidor(M.progreso(proy), proy.estado === 'cerrado')}
        <div class="chips mt-sm">
          <span class="chip">Semana ${M.semanaActual(proy)} de ${proy.semanas}</span>
          <span class="chip">Mentor: ${M.nombre(proy.mentorId)}</span>
          <span class="chip">${proy.estudianteIds.length} ${U.plural(proy.estudianteIds.length, 'estudiante')}</span>
        </div>
      </div>

      <div class="tabs mt">${tabs.map(function (t) {
        return h`<a class="tab ${tab === t.k ? 'is-on' : ''}" href="#/proyecto/${proy.id}?tab=${t.k}">
          ${t.l}${t.n ? raw(' <span class="chip chip--warn tiny">' + t.n + '</span>') : ''}</a>`;
      })}</div>

      ${cuerpo(proy, r, u)}`;
  };

  /* ---------- Resumen ---------- */
  function tabResumen(proy, r, u) {
    var siguiente = (proy.hitos || []).filter(function (x) { return x.estado !== 'aprobado'; })[0];
    var ultimas = U.sortBy(proy.bitacora || [], function (b) { return b.at; }, true)
      .filter(function (b) { return u.rol !== 'empresa' || b.visibleEmpresa; }).slice(0, 4);

    return h`<div class="split">
      <div class="stack">
        <div class="card">
          <h2 style="font-size:1.05rem">El reto</h2>
          <p style="white-space:pre-wrap">${r.problema}</p>
          <h3 class="mt">Resultado esperado</h3>
          <p style="white-space:pre-wrap">${r.resultado}</p>
          ${(r.entregables || []).length ? h`<h3 class="mt">Entregables comprometidos</h3>
            <ul>${r.entregables.map(function (e) { return h`<li>${e}</li>`; })}</ul>` : ''}
        </div>

        <div class="panel">
          <div class="panel__head"><h3>Últimos movimientos</h3>
            <a class="tiny" href="#/proyecto/${proy.id}?tab=bitacora">Ver bitácora</a></div>
          ${ultimas.length ? h`<div class="panel__body"><ul class="bitacora">${ultimas.map(function (b) { return itemBitacora(b); })}</ul></div>`
            : h`<div class="panel__body center"><p class="small muted mb0">Aún no hay registros en la bitácora.</p></div>`}
        </div>
      </div>

      <div class="stack">
        ${siguiente ? h`<div class="card card--accent">
          <h3>Hito en curso</h3>
          <p class="small muted mb0">Semana ${siguiente.semana} · vence ${U.fecha(siguiente.fechaLimite)}</p>
          <p style="font-weight:700;margin:.3rem 0">${siguiente.titulo}</p>
          <p class="small muted">${siguiente.descripcion}</p>
          ${C.chipHito(siguiente)}
          <a class="btn btn--primary btn--block mt-sm" href="#/proyecto/${proy.id}?tab=hitos">Ir a los hitos</a>
        </div>` : h`<div class="card">${C.aviso('ok', '🎉', 'Todos los hitos fueron aprobados.')}</div>`}

        <div class="card">
          <h3>Equipo</h3>
          <ul class="list">
            ${proy.estudianteIds.map(function (id) {
              return h`<li style="padding:.5rem 0">${C.persona(M.usuario(id),
                (proy.liderId === id ? 'Líder · ' : '') + (M.usuario(id) ? M.usuario(id).carrera : ''))}</li>`;
            })}
            <li style="padding:.5rem 0">${C.persona(M.usuario(proy.mentorId), 'Docente mentor')}</li>
            <li style="padding:.5rem 0">${C.persona(M.usuario(proy.empresaId), 'Empresa')}</li>
          </ul>
        </div>

        <div class="card">
          <h3>Cronograma</h3>
          <ul class="timeline">
            ${(proy.hitos || []).map(function (hi) {
              var cls = hi.estado === 'aprobado' ? 'timeline__dot--ok'
                : (hi.estado === 'observado' ? 'timeline__dot--warn'
                : (hi.estado === 'entregado' ? 'timeline__dot--now' : ''));
              return h`<li><span class="timeline__dot ${cls}"></span>
                <p class="timeline__t">${hi.titulo}</p>
                <p class="timeline__m">Semana ${hi.semana} · ${U.fecha(hi.fechaLimite)}</p>
              </li>`;
            })}
          </ul>
        </div>
      </div>
    </div>`;
  }

  /* ---------- Hitos ---------- */
  function tabHitos(proy, r, u) {
    var puedeEntregar = Auth.can('hito:entregar', proy);
    var puedeRevisar = Auth.can('hito:revisar', proy);

    return h`<div class="stack">
      ${!puedeEntregar && !puedeRevisar ? C.aviso('info', 'ℹ️', 'Estás viendo el avance del equipo. Solo el equipo entrega y el mentor revisa.') : ''}
      ${(proy.hitos || []).map(function (hi) {
        return h`<div class="hito hito--${hi.estado}">
          <div class="hito__head">
            <div class="hcol">
              <p class="tiny muted mb0">Semana ${hi.semana} · vence ${U.fecha(hi.fechaLimite)}</p>
              <h3 style="margin:.1rem 0">${hi.titulo}</h3>
              <p class="small muted mb0">${hi.descripcion}</p>
            </div>
            ${C.chipHito(hi)}
          </div>

          ${hi.evidencia ? h`<p class="small mt-sm mb0">
            📎 <a href="${U.safeUrl(hi.evidencia)}" target="_blank" rel="noopener noreferrer">${U.hostOf(hi.evidencia) || 'Ver evidencia'}</a>
            ${hi.entregadoAt ? h`<span class="tiny muted"> · entregado ${U.haceTiempo(hi.entregadoAt)}</span>` : ''}
          </p>` : ''}
          ${hi.nota ? h`<p class="small muted" style="white-space:pre-wrap">${hi.nota}</p>` : ''}
          ${hi.feedback ? h`<div class="mt-sm">${C.aviso(hi.estado === 'observado' ? 'warn' : 'ok',
            hi.estado === 'observado' ? '⚠️' : '✅', raw('<b>Mentor:</b> ' + U.esc(hi.feedback)))}</div>` : ''}

          ${puedeEntregar && ['pendiente', 'observado'].indexOf(hi.estado) !== -1 ? h`
            <form class="mt-sm" data-action="hito:entregar">
              <input type="hidden" name="proyectoId" value="${proy.id}">
              <input type="hidden" name="hitoId" value="${hi.id}">
              <div class="field-row field-row--2">
                ${C.campo({ name: 'evidencia', label: 'Enlace a la evidencia', required: true,
                  placeholder: 'https://drive.google.com/…', valor: hi.evidencia })}
                ${C.campo({ name: 'nota', label: 'Comentario para el mentor', placeholder: 'Qué incluye esta entrega' })}
              </div>
              <button class="btn btn--primary btn--sm" type="submit">Entregar hito</button>
            </form>` : ''}

          ${puedeRevisar && hi.estado === 'entregado' ? h`
            <form class="mt-sm" data-action="hito:revisar">
              <input type="hidden" name="proyectoId" value="${proy.id}">
              <input type="hidden" name="hitoId" value="${hi.id}">
              ${C.campo({ name: 'feedback', label: 'Comentario para el equipo', tipo: 'textarea', rows: 2,
                placeholder: 'Qué está bien y qué debe mejorar' })}
              <div class="btnrow">
                <button class="btn btn--ok btn--sm" type="submit" name="decision" value="aprobado">Aprobar hito</button>
                <button class="btn btn--ghost btn--sm" type="submit" name="decision" value="observado">Devolver con observaciones</button>
              </div>
            </form>` : ''}
        </div>`;
      })}
    </div>`;
  }

  /* ---------- Bitácora ---------- */
  var TIPOS_BITACORA = { avance: '📈 Avance', bloqueo: '🚧 Bloqueo', reunion: '🤝 Reunión', decision: '🧭 Decisión', entrega: '📦 Entrega' };

  function itemBitacora(b) {
    var autor = M.usuario(b.autorId);
    return h`<li class="bitacora__item">
      ${C.avatar(autor, 'avatar--sm')}
      <div class="bitacora__b">
        <div class="bitacora__meta">
          <b>${autor ? autor.nombre : 'Usuario'}</b>
          <span class="chip tiny">${TIPOS_BITACORA[b.tipo] || b.tipo}</span>
          <span>Semana ${b.semana}</span>
          ${b.horas ? h`<span>· ${b.horas} h</span>` : ''}
          <span>· ${U.haceTiempo(b.at)}</span>
          ${!b.visibleEmpresa ? h`<span class="chip tiny">Solo equipo y UPN</span>` : ''}
        </div>
        <p>${b.texto}</p>
      </div>
    </li>`;
  }

  function tabBitacora(proy, r, u) {
    var visibles = (proy.bitacora || []).filter(function (b) { return u.rol !== 'empresa' || b.visibleEmpresa; });
    var lista = U.sortBy(visibles, function (b) { return b.at; }, true);
    var horas = U.sum(proy.bitacora || [], function (b) { return b.horas || 0; });

    return h`<div class="split">
      <div>
        <div class="panel">
          <div class="panel__head"><h3>Bitácora del proyecto</h3>
            <span class="tiny muted">${horas} horas registradas</span></div>
          ${lista.length ? h`<div class="panel__body"><ul class="bitacora">${lista.map(itemBitacora)}</ul></div>`
            : h`<div class="panel__body">${C.vacio('📓', 'Bitácora vacía', 'Registra aquí reuniones, avances y bloqueos. Este historial respalda la constancia.')}</div>`}
        </div>
      </div>
      <div>
        ${Auth.can('bitacora:escribir', proy) ? h`<form class="card" data-action="bitacora:agregar">
          <input type="hidden" name="proyectoId" value="${proy.id}">
          <h3>Registrar avance</h3>
          ${C.campo({ name: 'tipo', label: 'Tipo', tipo: 'select',
            opciones: Object.keys(TIPOS_BITACORA).map(function (k) { return { value: k, label: TIPOS_BITACORA[k] }; }) })}
          <div class="field-row field-row--2">
            ${C.campo({ name: 'semana', label: 'Semana', tipo: 'number', min: 1, max: proy.semanas, valor: M.semanaActual(proy) })}
            ${C.campo({ name: 'horas', label: 'Horas dedicadas', tipo: 'number', min: 0, max: 40, valor: 2 })}
          </div>
          ${C.campo({ name: 'texto', label: '¿Qué pasó?', tipo: 'textarea', rows: 4, required: true,
            placeholder: 'Describe el avance, la reunión o el problema encontrado.' })}
          <label class="checkline checkline--on">
            <input type="checkbox" name="visibleEmpresa" value="true" checked>
            <span>Visible para la empresa</span>
          </label>
          <button class="btn btn--primary btn--block mt-sm" type="submit">Guardar en la bitácora</button>
          <p class="tiny muted mt-sm mb0">Las entradas no se pueden borrar: la bitácora es el respaldo del trabajo realizado.</p>
        </form>` : h`<div class="card">${C.aviso('info', 'ℹ️', 'La bitácora es de solo lectura para tu rol o el proyecto ya está cerrado.')}</div>`}
      </div>
    </div>`;
  }

  /* ---------- Entrega final ---------- */
  function tabEntrega(proy, r, u) {
    var ef = proy.entregaFinal;
    if (ef) {
      return h`<div class="split">
        <div class="card">
          <h2 style="font-size:1.1rem">${ef.titulo}</h2>
          <p class="small muted">Enviada por ${M.nombre(ef.porId)} · ${U.haceTiempo(ef.at)}</p>
          <p style="white-space:pre-wrap">${ef.resumen}</p>
          <h3 class="mt">Entregables</h3>
          <ul class="list">
            ${(ef.enlaces || []).map(function (e) {
              return h`<li><a class="listitem" style="padding-left:0" href="${U.safeUrl(e.url)}" target="_blank" rel="noopener noreferrer">
                <span class="avatar avatar--sm" aria-hidden="true">🔗</span>
                <span class="listitem__main"><span class="listitem__t">${e.label}</span>
                  <span class="listitem__s">${U.hostOf(e.url)}</span></span>
              </a></li>`;
            })}
          </ul>
        </div>
        <div class="card">
          <h3>Estado</h3>
          ${proy.estado === 'en_validacion' ? C.aviso('warn', '⏳', 'Esperando la evaluación del mentor y de la empresa.')
            : (proy.estado === 'cerrado' ? C.aviso('ok', '🏅', 'Proyecto cerrado y constancias emitidas.')
            : C.aviso('ok', '✅', 'Entrega aprobada. Falta emitir las constancias.'))}
          <a class="btn btn--ghost btn--block mt-sm" href="#/proyecto/${proy.id}?tab=evaluacion">Ver evaluación</a>
        </div>
      </div>`;
    }

    if (!Auth.can('entrega:final', proy)) {
      return C.vacio('📦', 'Todavía no hay entrega final',
        'El equipo enviará el resultado cuando complete los hitos del microproyecto.');
    }

    var pendientes = (proy.hitos || []).filter(function (x) { return x.estado !== 'aprobado'; });
    return h`<div style="max-width:700px">
      ${pendientes.length > 1 ? C.aviso('warn', '⚠️',
        'Te faltan ' + pendientes.length + ' hitos por aprobar. Complétalos antes de la entrega final.') : ''}
      <form class="card mt-sm" data-action="entrega:final">
        <input type="hidden" name="proyectoId" value="${proy.id}">
        <h2 style="font-size:1.1rem">Enviar la entrega final</h2>
        <p class="small muted">Esto notifica al mentor y a la empresa para que evalúen el trabajo.</p>
        ${C.campo({ name: 'titulo', label: 'Título de la entrega', required: true,
          valor: 'Entrega final — ' + U.truncar(r.titulo, 50) })}
        ${C.campo({ name: 'resumen', label: 'Resumen de lo entregado', tipo: 'textarea', rows: 5, required: true,
          placeholder: 'Qué se hizo, qué se logró y qué debe hacer la empresa de ahora en adelante.' })}
        <h3 class="mt">Enlaces a los entregables</h3>
        <div class="field-row field-row--2">
          ${C.campo({ name: 'label1', label: 'Nombre', valor: 'Carpeta de entregables' })}
          ${C.campo({ name: 'url1', label: 'Enlace', required: true, placeholder: 'https://drive.google.com/…' })}
        </div>
        <div class="field-row field-row--2">
          ${C.campo({ name: 'label2', label: 'Nombre (opcional)' })}
          ${C.campo({ name: 'url2', label: 'Enlace (opcional)' })}
        </div>
        <div class="field-row field-row--2">
          ${C.campo({ name: 'label3', label: 'Nombre (opcional)' })}
          ${C.campo({ name: 'url3', label: 'Enlace (opcional)' })}
        </div>
        <button class="btn btn--primary btn--block btn--lg" type="submit">Enviar entrega final</button>
      </form>
    </div>`;
  }

  /* ---------- Evaluación ---------- */
  function tabEvaluacion(proy, r, u) {
    var evs = proy.evaluaciones || [];
    var mentorEv = evs.filter(function (e) { return e.rol === 'mentor'; })[0];
    var empresaEv = evs.filter(function (e) { return e.rol === 'empresa'; })[0];
    var certs = Store.where('constancias', function (c) { return c.proyectoId === proy.id; });

    return h`<div class="split">
      <div class="stack">
        ${tarjetaEval('Evaluación del docente mentor', mentorEv, proy)}
        ${tarjetaEval('Evaluación de la empresa', empresaEv, proy)}
        ${!proy.entregaFinal ? C.aviso('info', 'ℹ️', 'La evaluación se habilita cuando el equipo envía la entrega final.') : ''}
      </div>

      <div class="stack">
        ${(Auth.can('evaluar:mentor', proy) || Auth.can('evaluar:empresa', proy)) ? formEvaluacion(proy, u) : ''}

        ${proy.estado === 'aprobado' && Auth.can('constancia:emitir', proy) ? h`<div class="card card--accent">
          <h3>Emitir constancias</h3>
          <p class="small muted">Se generará una constancia con código verificable para cada integrante del equipo.</p>
          <ul class="list">${proy.estudianteIds.map(function (id) {
            return h`<li style="padding:.4rem 0">${C.persona(M.usuario(id), proy.liderId === id ? 'Líder de equipo' : 'Integrante')}</li>`;
          })}</ul>
          <button class="btn btn--primary btn--block" data-action="constancia:emitir" data-id="${proy.id}"
            data-confirm="¿Emitir las constancias y cerrar el microproyecto? Esta acción no se puede deshacer.">
            ${C.icono('medalla', 18)} Emitir ${proy.estudianteIds.length} ${U.plural(proy.estudianteIds.length, 'constancia')}
          </button>
        </div>` : ''}

        ${certs.length ? h`<div class="card">
          <h3>Constancias emitidas</h3>
          <ul class="list">${certs.map(function (c) {
            return h`<li><a class="listitem" style="padding-left:0" href="#/constancia/${c.codigo}">
              <span class="avatar avatar--sm" aria-hidden="true">🏅</span>
              <span class="listitem__main">
                <span class="listitem__t">${c.snapshot.estudiante}</span>
                <span class="listitem__s"><code>${c.codigo}</code></span>
              </span>
              <span class="listitem__end">${c.estado === 'vigente' ? h`<span class="chip chip--ok">Vigente</span>` : h`<span class="chip chip--danger">Anulada</span>`}</span>
            </a></li>`;
          })}</ul>
        </div>` : ''}

        <div class="card">
          <h3>Rúbrica</h3>
          <ul class="small muted" style="margin-bottom:0;padding-left:1rem">
            ${CFG.RUBRICA.map(function (c) { return h`<li><b>${c.label}:</b> ${c.ayuda}</li>`; })}
          </ul>
        </div>
      </div>
    </div>`;
  }

  function tarjetaEval(titulo, ev, proy) {
    if (!ev) return h`<div class="card"><h3>${titulo}</h3><p class="small muted mb0">Pendiente.</p></div>`;
    return h`<div class="card">
      <div class="row row--between"><h3 style="margin:0">${titulo}</h3>
        <span class="chip ${ev.decision === 'aprobado' ? 'chip--ok' : 'chip--warn'}">${ev.decision === 'aprobado' ? 'Aprobado' : 'Observado'}</span></div>
      <p class="tiny muted">${M.nombre(ev.evaluadorId)} · ${U.haceTiempo(ev.at)} · ${M.puntajeEval(ev)}/100</p>
      <ul class="list">
        ${CFG.RUBRICA.map(function (c) {
          return h`<li style="padding:.35rem 0"><div class="row row--between">
            <span class="small">${c.label}</span>${C.estrellas(ev.criterios[c.id] || 0)}</div></li>`;
        })}
      </ul>
      ${ev.comentario ? h`<blockquote class="small" style="border-left:3px solid var(--lucuma);padding-left:.8rem;margin:.6rem 0 0;color:var(--text-soft)">${ev.comentario}</blockquote>` : ''}
    </div>`;
  }

  function formEvaluacion(proy, u) {
    return h`<form class="card card--accent" data-action="evaluacion:enviar">
      <input type="hidden" name="proyectoId" value="${proy.id}">
      <h3>Tu evaluación</h3>
      <p class="small muted">Califica del 1 (muy bajo) al 5 (excelente).</p>
      ${CFG.RUBRICA.map(function (c) {
        return h`<div class="field">
          <span class="field__label">${c.label}</span>
          <p class="tiny muted" style="margin:0 0 .3rem">${c.ayuda}</p>
          ${C.selectorEstrellas('crit_' + c.id, 4)}
        </div>`;
      })}
      ${C.campo({ name: 'comentario', label: 'Comentario', tipo: 'textarea', rows: 3,
        placeholder: u.rol === 'empresa' ? '¿Qué te pareció el resultado? ¿Lo estás usando?' : '¿Cómo trabajó el equipo?' })}
      <div class="btnrow">
        <button class="btn btn--primary" type="submit" name="decision" value="aprobado">Aprobar entrega</button>
        <button class="btn btn--ghost" type="submit" name="decision" value="observado">Observar y devolver</button>
      </div>
    </form>`;
  }

  /* ---------- Equipo ---------- */
  function tabEquipo(proy, r, u) {
    return h`<div class="grid grid--auto">
      ${proy.estudianteIds.map(function (id) {
        var e = M.usuario(id);
        if (!e) return '';
        var horas = U.sum((proy.bitacora || []).filter(function (b) { return b.autorId === id; }), function (b) { return b.horas || 0; });

            ${(s.habilidades || []).map(function (x) { return h`<span class="chip chip--brand">${x}</span>`; })}

          ${s.logro ? h`<p class="cert__line" style="margin-top:1rem;font-style:italic">“${s.logro}”</p>` : ''}

          <div class="cert__firmas">

              <p class="tiny" style="margin:.35rem 0 0;color:#8C877E">${urlVerif}</p>
            </div>
            <div class="cert__qr">${qrDecorativo(c.codigo)}</div>
          </div>
        </div>
      </article>

      <p class="small muted center mt no-print">
        Cualquiera puede comprobar la autenticidad de esta constancia en
        <a href="#/verificar/${c.codigo}">la página de verificación</a>.
      </p>
    </div>`;
  };

  /* Patrón visual determinista a partir del código (sin librerías externas) */
  function qrDecorativo(codigo) {
    var limpio = String(codigo).replace(/[^A-Z0-9]/gi, '');
    var celdas = '';
    var n = 9, cell = 8;
    for (var y = 0; y < n; y++) {
      for (var x = 0; x < n; x++) {
        var i = y * n + x;
        var ch = limpio.charCodeAt(i % limpio.length) || 65;
        var on = ((ch + i * 7 + x * 3 + y * 5) % 3) === 0;
        // Esquinas de referencia siempre pintadas
        var esquina = (x < 3 && y < 3) || (x > n - 4 && y < 3) || (x < 3 && y > n - 4);
        var borde = esquina && (x === 0 || y === 0 || x === 2 || y === 2 || x === n - 1 || x === n - 3 || y === n - 1 || y === n - 3);
        if (esquina) on = borde || (x === 1 && y === 1) || (x === n - 2 && y === 1) || (x === 1 && y === n - 2);
        if (on) celdas += '<rect x="' + (x * cell) + '" y="' + (y * cell) + '" width="' + cell + '" height="' + cell + '"/>';
      }
    }
    return raw('<svg viewBox="0 0 ' + (n * cell) + ' ' + (n * cell) + '" width="76" height="76" fill="#3C3C3B" role="img" aria-label="Patrón del código ' +
      U.esc(codigo) + '"><rect width="' + (n * cell) + '" height="' + (n * cell) + '" fill="#fff"/>' + celdas + '</svg>');
  }
})();

  function perfilPublico(persona) {

    if (persona.rol === 'estudiante') {
      var certs = M.constanciasDe(persona.id).filter(function (c) { return c.estado === 'vigente'; });
      var rating = M.ratingEstudiante(persona.id);
      return h`<div style="max-width:860px;margin:0 auto">
        ${C.volver('#/talento')}
        <div class="card mt-sm">
          <div class="card__head">${C.avatar(persona, 'avatar--xl')}

            </div>
            ${M.tieneProyectoActivo(persona.id) ? h`<span class="chip chip--warn">Con proyecto activo</span>` : h`<span class="chip chip--ok">Disponible</span>`}</div>

          <div class="chips">
            <span class="chip">${persona.horasSemana} h/semana</span>
            <span class="chip">${CFG.MODALIDADES[persona.modalidad]}</span>
            ${rating ? h`<span class="chip chip--ok">Desempeño ${rating}/100</span>` : ''}
          </div>
        </div>

        <div class="grid grid--2 mt">
          <div class="card">
            <h2 style="font-size:1.05rem">Habilidades declaradas</h2>
            ${(persona.habilidades || []).length ? h`<ul class="list">
              ${U.sortBy(persona.habilidades || [], function (s) { return s.nivel; }, true).map(function (s) {
                return h`<li style="padding:.4rem 0"><div class="row row--between">
                  <span class="small">${M.habilidadNombre(s.skill)}</span>
                  <span style="width:110px">${C.progreso(s.nivel * 20)}</span></div></li>`;
              })}</ul>` : h`<p class="small muted">Sin habilidades registradas.</p>`}
          </div>
          <div class="card">
            <h2 style="font-size:1.05rem">Experiencia acreditada</h2>
            ${certs.length ? h`<ul class="list">${certs.map(function (c) {
              return h`<li style="padding:.5rem 0">
                <p class="small mb0"><b>${U.truncar(c.snapshot.reto, 42)}</b></p>
                <p class="tiny muted mb0">${c.snapshot.empresa} · ${c.snapshot.horas} h · ${c.snapshot.puntaje}/100</p>
              </li>`;
            })}</ul>
            ${persona.portafolioPublico && persona.slug ? h`<a class="btn btn--ghost btn--sm btn--block mt-sm" href="#/portafolio/${persona.slug}">Ver portafolio completo</a>` : ''}`
              : h`<p class="small muted">Aún no ha cerrado microproyectos.</p>`}
          </div>
        </div>

    return h`<div style="max-width:640px;margin:0 auto">
      ${C.volver('#/')}
      <div class="card mt-sm">
        <div class="card__head">${C.avatar(persona, 'avatar--xl')}
          <div class="hcol"><h1 style="font-size:1.3rem;margin:0">${persona.nombre}</h1>
            <p class="small muted mb0">${persona.especialidad || persona.area || ''}</p></div>${C.chipRol(persona.rol)}</div>
        <p>${persona.bio || ''}</p>
        ${persona.rol === 'mentor' ? h`<div class="chips">${(persona.habilidades || []).map(function (s) {
          return h`<span class="chip chip--brand">${M.habilidadNombre(s)}</span>`; })}</div>` : ''}
      </div>
    </div>`;
  }

  function bloqueSesion() {
    return h`<div class="card mt">
      <h3>Cuenta</h3>
      <div class="btnrow">

  /* ================= Ajustes ================= */
  Vistas.ajustes = function () {
    var tema = UI.temaActual();
    return h`<div style="max-width:700px;margin:0 auto">
      ${C.pageHead('Ajustes', 'Preferencias de la aplicación y datos de demostración')}

      <div class="card mt">
        <h3>Sobre este aplicativo</h3>

          UPN Talent Lab es un prototipo funcional del programa de vinculación entre estudiantes de la
