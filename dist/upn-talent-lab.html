window.M = (function () {

  /* ================= Helpers de lectura ================= */
  function usuario(id) { return Store.find('users', id); }
  function nombre(id) { var u = usuario(id); return u ? u.nombre : 'Usuario'; }
  function empresaNombre(id) { var u = usuario(id); return u ? (u.razonSocial || u.nombre) : 'Empresa'; }
  function reto(id) { return Store.find('retos', id); }
  function proyecto(id) { return Store.find('proyectos', id); }
  function habilidadNombre(id) { return (CFG.HABILIDADES[id] || {}).nombre || id; }
  function categoria(id) { return CFG.CATEGORIAS[id] || { label: id, icono: '📌' }; }

  function estudiantes() { return Store.where('users', function (u) { return u.rol === 'estudiante'; }); }
  function empresas() { return Store.where('users', function (u) { return u.rol === 'empresa'; }); }
  function mentores() { return Store.where('users', function (u) { return u.rol === 'mentor'; }); }
  function coordinadores() { return Store.where('users', function (u) { return u.rol === 'coordinador'; }); }

  function proyectoDeReto(retoId) {
    return Store.where('proyectos', function (p) { return p.retoId === retoId; })[0] || null;
  }
  function postulacionesDe(retoId) {
    return Store.where('postulaciones', function (p) { return p.retoId === retoId; });
  }
  function postulacionDe(retoId, estudianteId) {
    return Store.where('postulaciones', function (p) {
      return p.retoId === retoId && p.estudianteId === estudianteId;
    })[0] || null;
  }
  function proyectosDe(userId) {
    var u = usuario(userId); if (!u) return [];
    return Store.where('proyectos', function (p) {
      if (u.rol === 'empresa') return p.empresaId === u.id;
      if (u.rol === 'mentor') return p.mentorId === u.id;
      if (u.rol === 'estudiante') return (p.estudianteIds || []).indexOf(u.id) !== -1;
      return true;
    });
  }
  function constanciasDe(estudianteId) {
    return Store.where('constancias', function (c) { return c.estudianteId === estudianteId; });
  }
  function constanciaPorCodigo(codigo) {
    var c = String(codigo || '').trim().toUpperCase();
    return Store.where('constancias', function (x) { return x.codigo.toUpperCase() === c; })[0] || null;
  }
  function cargaMentor(mentorId) {
    return Store.where('proyectos', function (p) {
      return p.mentorId === mentorId && ['en_curso', 'en_validacion'].indexOf(p.estado) !== -1;
    }).length;
  }
  function tieneProyectoActivo(estudianteId) {
    return Store.where('proyectos', function (p) {
      return (p.estudianteIds || []).indexOf(estudianteId) !== -1 &&
             ['en_curso', 'en_validacion'].indexOf(p.estado) !== -1;
    }).length > 0;
  }
  function proyectosCompletados(estudianteId) {
    return Store.where('proyectos', function (p) {
      return (p.estudianteIds || []).indexOf(estudianteId) !== -1 && p.estado === 'cerrado';
    });
  }
  function ratingEstudiante(estudianteId) {
    var evs = [];
    proyectosCompletados(estudianteId).forEach(function (p) {
      (p.evaluaciones || []).forEach(function (e) { evs.push(puntajeEval(e)); });
    });
    if (!evs.length) return null;
    return Math.round(U.sum(evs) / evs.length);
  }
  function puntajeEval(ev) {
    var vals = CFG.RUBRICA.map(function (c) { return ev.criterios[c.id] || 0; });
    return Math.round((U.sum(vals) / (vals.length * 5)) * 100);
  }
  function puntajeProyecto(p) {
    var evs = p.evaluaciones || [];
    if (!evs.length) return null;
    return Math.round(U.sum(evs.map(puntajeEval)) / evs.length);
  }
  function progreso(p) {
    var hs = p.hitos || [];
    if (!hs.length) return 0;
    return U.pct(hs.filter(function (h) { return h.estado === 'aprobado'; }).length, hs.length);
  }
  function semanaActual(p) {
    var t = U.diasEntre(p.inicio, U.hoy());
    return U.clamp(Math.floor(t / 7) + 1, 1, p.semanas);
  }
  function horasProyecto(p, estudianteId) {
    var h = U.sum((p.bitacora || []).filter(function (b) {
      return !estudianteId || b.autorId === estudianteId;
    }), function (b) { return b.horas || 0; });
    // Si no hay horas registradas se usa la carga estimada del reto
    var r = reto(p.retoId);
    var estimado = (r ? r.horasSemana : 10) * p.semanas;
    return Math.max(h, estimado);
  }

  /* ================= Notificaciones ================= */
  function notificar(userId, tipo, titulo, cuerpo, link) {
    if (!userId) return;
    Store.get().notificaciones.push({
      id: U.uid('n'), userId: userId, tipo: tipo, titulo: titulo,
      cuerpo: cuerpo, link: link || '', leida: false, at: new Date().toISOString()
    });
  }
  function notificacionesDe(userId) {
    return U.sortBy(Store.where('notificaciones', function (n) { return n.userId === userId; }),
      function (n) { return n.at; }, true);
  }
  function noLeidas(userId) {
    return Store.where('notificaciones', function (n) { return n.userId === userId && !n.leida; }).length;
  }
  function marcarLeidas(userId) {
    Store.tx(function (d) {
      d.notificaciones.forEach(function (n) { if (n.userId === userId) n.leida = true; });
    });
  }

  /* ================= Retos ================= */
  function crearReto(empresaId, datos) {
    var codigo = Store.siguienteCodigo('reto', 'RET');
    var r = {
      id: U.uid('r'), codigo: codigo, empresaId: empresaId,
      titulo: datos.titulo, problema: datos.problema, resultado: datos.resultado,
      categoria: datos.categoria, entregables: datos.entregables || [],
      habilidadesRequeridas: datos.habilidadesRequeridas || [],
      habilidadesDeseables: datos.habilidadesDeseables || [],
      semanas: parseInt(datos.semanas, 10) || 3,
      horasSemana: parseInt(datos.horasSemana, 10) || 10,
      tamanoEquipo: parseInt(datos.tamanoEquipo, 10) || 2,
      modalidad: datos.modalidad || 'hibrido',
      fechaLimitePostulacion: datos.fechaLimitePostulacion || U.sumarDias(U.hoy(), 14),
      estado: 'borrador', notasRevision: '',
      creado: new Date().toISOString(),
      historial: [{ estado: 'borrador', at: new Date().toISOString(), por: empresaId, nota: '' }]
    };
    Store.insert('retos', r);
    Store.auditar('reto:crear', 'reto', r.id);
    return r;
  }

  function transicionesPosibles(r, rol) {
    var map = CFG.RETO_TRANSICIONES[r.estado] || {};
    return Object.keys(map).filter(function (destino) {
      return map[destino].indexOf(rol) !== -1;
    });
  }

  function transicionReto(retoId, destino, opts) {
    opts = opts || {};
    var u = Auth.actual();
    var r = reto(retoId);
    if (!r) return { ok: false, error: 'El reto no existe.' };
    var permitidos = transicionesPosibles(r, u ? u.rol : null);
    if (permitidos.indexOf(destino) === -1)
      return { ok: false, error: 'No puedes cambiar el reto de “' + CFG.RETO_ESTADOS[r.estado].label + '” a “' + (CFG.RETO_ESTADOS[destino] || {}).label + '”.' };

    Store.tx(function () {
      r.estado = destino;
      if (destino === 'publicado') r.publicado = new Date().toISOString();
      if (opts.nota !== undefined) r.notasRevision = opts.nota;
      r.historial.push({ estado: destino, at: new Date().toISOString(), por: u ? u.id : null, nota: opts.nota || '' });
      Store.auditar('reto:' + destino, 'reto', r.id, { nota: opts.nota || '' });

      /* Notificaciones según el destino */
      if (destino === 'en_revision') {
        coordinadores().forEach(function (c) {
          notificar(c.id, 'reto', 'Nuevo reto para revisar',
            empresaNombre(r.empresaId) + ' envió “' + r.titulo + '”.', '#/reto/' + r.id);
        });
      }
      if (destino === 'publicado') {
        notificar(r.empresaId, 'reto', 'Tu reto fue publicado',
          '“' + r.titulo + '” ya está visible para los estudiantes.', '#/reto/' + r.id);
      }
      if (destino === 'observado') {
        notificar(r.empresaId, 'reto', 'Tu reto tiene observaciones',
          opts.nota || 'La coordinación dejó comentarios para ajustar el reto.', '#/reto/' + r.id);
      }
      if (destino === 'rechazado') {
        notificar(r.empresaId, 'reto', 'Tu reto no fue aprobado',
          opts.nota || 'La coordinación no aprobó este reto.', '#/reto/' + r.id);
      }
      if (destino === 'en_seleccion') {
        coordinadores().forEach(function (c) {
          notificar(c.id, 'seleccion', 'Postulaciones cerradas',
            '“' + r.titulo + '” está listo para conformar equipo.', '#/matching/' + r.id);
        });
      }
    });
    return { ok: true, reto: r };
  }

  /* ================= Postulaciones ================= */
  function postular(estudianteId, retoId, datos) {
    var r = reto(retoId);
    if (!r) return { ok: false, error: 'El reto no existe.' };
    if (r.estado !== 'publicado') return { ok: false, error: 'Este reto ya no recibe postulaciones.' };
    if (r.fechaLimitePostulacion && U.diasEntre(U.hoy(), r.fechaLimitePostulacion) < 0)
      return { ok: false, error: 'El plazo para postular venció el ' + U.fecha(r.fechaLimitePostulacion) + '.' };
    if (postulacionDe(retoId, estudianteId)) return { ok: false, error: 'Ya postulaste a este reto.' };
    if (tieneProyectoActivo(estudianteId))
      return { ok: false, error: 'Ya tienes un microproyecto en curso. Solo se permite uno a la vez.' };
    if (!String(datos.motivacion || '').trim())
      return { ok: false, error: 'Cuéntale a la empresa por qué quieres participar.' };

    var res = Matching.evaluar(usuario(estudianteId), r);
    var p = {
      id: U.uid('post'), retoId: retoId, estudianteId: estudianteId,
      motivacion: String(datos.motivacion).trim(),
      disponibilidadConfirmada: !!datos.disponibilidad,
      estado: 'postulada', score: res.total, creado: new Date().toISOString()
    };
    Store.insert('postulaciones', p);
    Store.tx(function () {
      Store.auditar('postulacion:crear', 'postulacion', p.id, { retoId: retoId });
      notificar(r.empresaId, 'postulacion', 'Nueva postulación',
        nombre(estudianteId) + ' postuló a “' + r.titulo + '”.', '#/reto/' + r.id);
    });
    return { ok: true, postulacion: p };
  }

  function retirarPostulacion(postId) {
    var p = Store.find('postulaciones', postId);
    if (!p) return { ok: false, error: 'No existe la postulación.' };
    if (p.estado === 'seleccionada') return { ok: false, error: 'Ya fuiste seleccionado; comunícate con la coordinación.' };
    Store.remove('postulaciones', postId);
    return { ok: true };
  }

  function decidirPostulacion(postId, estado, nota) {
    var p = Store.find('postulaciones', postId);
    if (!p) return { ok: false, error: 'No existe la postulación.' };
    Store.tx(function () {
      p.estado = estado;
      p.nota = nota || '';
      p.decididaAt = new Date().toISOString();
      Store.auditar('postulacion:' + estado, 'postulacion', p.id);
    });
    return { ok: true };
  }

  /* ================= Conformación de equipo ================= */
  function conformarEquipo(retoId, opts) {
    var r = reto(retoId);
    if (!r) return { ok: false, error: 'El reto no existe.' };
    if (r.estado !== 'en_seleccion') return { ok: false, error: 'El reto debe estar en selección para conformar el equipo.' };
    var ids = opts.estudianteIds || [];
    if (!ids.length) return { ok: false, error: 'Selecciona al menos un estudiante.' };
    if (!opts.mentorId) return { ok: false, error: 'Asigna un docente o mentor.' };
    var mentor = usuario(opts.mentorId);
    if (!mentor || mentor.rol !== 'mentor') return { ok: false, error: 'El mentor seleccionado no es válido.' };
    if (cargaMentor(mentor.id) >= (mentor.maxProyectos || 3))
      return { ok: false, error: 'Ese mentor ya alcanzó su máximo de proyectos simultáneos.' };
    var ocupado = ids.filter(tieneProyectoActivo);
    if (ocupado.length) return { ok: false, error: nombre(ocupado[0]) + ' ya tiene un microproyecto en curso.' };

    var u = Auth.actual();
    var inicio = opts.inicio || U.sumarDias(U.hoy(), 3);
    var codigo = Store.siguienteCodigo('proyecto', 'PRY');
    var hitos = (CFG.PLANTILLA_HITOS[r.semanas] || CFG.PLANTILLA_HITOS[3]).map(function (h, i) {
      return {
        id: U.uid('hito'), semana: i + 1, titulo: h.titulo, descripcion: h.descripcion,
        fechaLimite: U.sumarDias(inicio, (i + 1) * 7), estado: 'pendiente',
        evidencia: '', nota: '', feedback: '', entregadoAt: null, revisadoAt: null
      };
    });

    var p = {
      id: U.uid('pr'), codigo: codigo, retoId: r.id, empresaId: r.empresaId,
      mentorId: mentor.id, estudianteIds: ids, liderId: opts.liderId || ids[0],
      coordinadorId: u ? u.id : null,
      inicio: inicio, fin: U.sumarDias(inicio, r.semanas * 7), semanas: r.semanas,
      estado: 'en_curso', creado: new Date().toISOString(),
      hitos: hitos, bitacora: [], entregaFinal: null, evaluaciones: []
    };

    Store.insert('proyectos', p);
    Store.tx(function () {
      r.estado = 'en_ejecucion';
      r.historial.push({ estado: 'en_ejecucion', at: new Date().toISOString(), por: u ? u.id : null, nota: 'Equipo conformado' });
      postulacionesDe(r.id).forEach(function (post) {
        post.estado = ids.indexOf(post.estudianteId) !== -1 ? 'seleccionada' : 'no_seleccionada';
        post.decididaAt = new Date().toISOString();
      });
      Store.auditar('equipo:conformar', 'proyecto', p.id, { retoId: r.id, integrantes: ids.length });

      ids.forEach(function (id) {
        notificar(id, 'proyecto', '¡Fuiste seleccionado!',
          'Trabajarás en “' + r.titulo + '” con ' + empresaNombre(r.empresaId) + '.', '#/proyecto/' + p.id);
      });
      postulacionesDe(r.id).filter(function (x) { return x.estado === 'no_seleccionada'; }).forEach(function (x) {
        notificar(x.estudianteId, 'postulacion', 'No fuiste seleccionado esta vez',
          'El equipo de “' + r.titulo + '” ya fue conformado. Sigue postulando a otros retos.', '#/retos');
      });
      notificar(mentor.id, 'proyecto', 'Nuevo proyecto asignado',
        'Acompañarás “' + r.titulo + '” con ' + ids.length + ' ' + U.plural(ids.length, 'estudiante') + '.', '#/proyecto/' + p.id);
      notificar(r.empresaId, 'proyecto', 'Tu equipo está listo',
        'La universidad conformó el equipo para “' + r.titulo + '”. El proyecto inicia el ' + U.fecha(inicio) + '.', '#/proyecto/' + p.id);
    });
    return { ok: true, proyecto: p };
  }

  /* ================= Hitos ================= */
  function entregarHito(proyectoId, hitoId, datos) {
    var p = proyecto(proyectoId); if (!p) return { ok: false, error: 'Proyecto no encontrado.' };
    var h = (p.hitos || []).filter(function (x) { return x.id === hitoId; })[0];
    if (!h) return { ok: false, error: 'Hito no encontrado.' };
    var url = U.safeUrl(datos.evidencia);
    if (!url) return { ok: false, error: 'Agrega un enlace válido con la evidencia (Drive, Figma, Canva, etc.).' };
    Store.tx(function () {
      h.estado = 'entregado'; h.evidencia = url; h.nota = String(datos.nota || '').trim();
      h.entregadoAt = new Date().toISOString();
      Store.auditar('hito:entregar', 'proyecto', p.id, { hito: h.titulo });
      notificar(p.mentorId, 'hito', 'Hito entregado para revisión',
        nombre(Auth.actual() ? Auth.actual().id : p.liderId) + ' entregó “' + h.titulo + '”.', '#/proyecto/' + p.id + '?tab=hitos');
      notificar(p.empresaId, 'proyecto', 'Avance del equipo',
        'El equipo entregó el hito “' + h.titulo + '”.', '#/proyecto/' + p.id);
    });
    return { ok: true };
  }

  function revisarHito(proyectoId, hitoId, decision, feedback) {
    var p = proyecto(proyectoId); if (!p) return { ok: false, error: 'Proyecto no encontrado.' };
    var h = (p.hitos || []).filter(function (x) { return x.id === hitoId; })[0];
    if (!h) return { ok: false, error: 'Hito no encontrado.' };
    if (decision === 'observado' && !String(feedback || '').trim())
      return { ok: false, error: 'Explica al equipo qué debe corregir.' };
    Store.tx(function () {
      h.estado = decision;
      h.feedback = String(feedback || '').trim();
      h.revisadoAt = new Date().toISOString();
      Store.auditar('hito:' + decision, 'proyecto', p.id, { hito: h.titulo });
      p.estudianteIds.forEach(function (id) {
        notificar(id, 'hito', decision === 'aprobado' ? 'Hito aprobado' : 'Hito observado',
          '“' + h.titulo + '”: ' + (h.feedback || 'Sin comentarios.'), '#/proyecto/' + p.id + '?tab=hitos');
      });
    });
    return { ok: true };
  }

  /* ================= Bitácora ================= */
  function agregarBitacora(proyectoId, datos) {
    var p = proyecto(proyectoId); if (!p) return { ok: false, error: 'Proyecto no encontrado.' };
    var texto = String(datos.texto || '').trim();
    if (texto.length < 10) return { ok: false, error: 'Escribe al menos una frase describiendo el avance.' };
    var u = Auth.actual();
    Store.tx(function () {
      p.bitacora.push({
        id: U.uid('b'), autorId: u.id, tipo: datos.tipo || 'avance',
        semana: parseInt(datos.semana, 10) || semanaActual(p),
        horas: parseFloat(datos.horas) || 0,
        texto: texto, visibleEmpresa: datos.visibleEmpresa !== false && datos.visibleEmpresa !== 'false',
        at: new Date().toISOString()
      });
      Store.auditar('bitacora:agregar', 'proyecto', p.id);
    });
    return { ok: true };
  }

  /* ================= Entrega final ================= */
  function entregaFinal(proyectoId, datos) {
    var p = proyecto(proyectoId); if (!p) return { ok: false, error: 'Proyecto no encontrado.' };
    var pendientes = (p.hitos || []).filter(function (h) { return h.estado !== 'aprobado'; });
    if (pendientes.length > 1)
      return { ok: false, error: 'Aún tienes ' + pendientes.length + ' hitos sin aprobar. Complétalos antes de la entrega final.' };
    if (!String(datos.resumen || '').trim()) return { ok: false, error: 'Describe qué estás entregando.' };
    var enlaces = (datos.enlaces || []).map(function (e) {
      return { label: String(e.label || 'Entregable').trim(), url: U.safeUrl(e.url) };
    }).filter(function (e) { return e.url; });
    if (!enlaces.length) return { ok: false, error: 'Agrega al menos un enlace al entregable.' };

    var u = Auth.actual();
    Store.tx(function () {
      p.entregaFinal = {
        titulo: String(datos.titulo || 'Entrega final').trim(),
        resumen: String(datos.resumen).trim(), enlaces: enlaces,
        at: new Date().toISOString(), porId: u.id
      };
      (p.hitos || []).forEach(function (h) {
        if (h.estado !== 'aprobado' && !h.evidencia) { h.estado = 'entregado'; h.entregadoAt = new Date().toISOString(); }
      });
      p.estado = 'en_validacion';
      Store.auditar('entrega:final', 'proyecto', p.id);
      notificar(p.mentorId, 'evaluacion', 'Entrega final recibida',
        'El equipo de “' + reto(p.retoId).titulo + '” envió la entrega final. Te toca evaluar.', '#/proyecto/' + p.id + '?tab=evaluacion');
      notificar(p.empresaId, 'evaluacion', 'Entrega final recibida',
        'Ya puedes revisar el resultado de “' + reto(p.retoId).titulo + '” y evaluarlo.', '#/proyecto/' + p.id + '?tab=evaluacion');
    });
    return { ok: true };
  }

  /* ================= Evaluación ================= */
  function evaluar(proyectoId, datos) {
    var p = proyecto(proyectoId); if (!p) return { ok: false, error: 'Proyecto no encontrado.' };
    var u = Auth.actual();
    var rol = u.rol === 'empresa' ? 'empresa' : 'mentor';
    if ((p.evaluaciones || []).some(function (e) { return e.rol === rol; }))
      return { ok: false, error: 'Ya registraste tu evaluación de este proyecto.' };

    var criterios = {};
    var faltan = [];
    CFG.RUBRICA.forEach(function (c) {
      var v = parseInt(datos['crit_' + c.id], 10);
      if (!v) faltan.push(c.label);
      criterios[c.id] = U.clamp(v || 0, 0, 5);
    });
    if (faltan.length) return { ok: false, error: 'Falta calificar: ' + faltan.join(', ') + '.' };

    var decision = datos.decision === 'observado' ? 'observado' : 'aprobado';
    if (decision === 'observado' && !String(datos.comentario || '').trim())
      return { ok: false, error: 'Explica qué debe corregir el equipo.' };

    Store.tx(function () {
      p.evaluaciones.push({
        id: U.uid('ev'), rol: rol, evaluadorId: u.id, at: new Date().toISOString(),
        decision: decision, criterios: criterios, comentario: String(datos.comentario || '').trim()
      });
      Store.auditar('evaluacion:' + rol, 'proyecto', p.id, { decision: decision });

      if (decision === 'observado') {
        p.estado = 'en_curso';
        p.entregaFinal = null;
        p.estudianteIds.forEach(function (id) {
          notificar(id, 'evaluacion', 'La entrega fue observada',
            String(datos.comentario || ''), '#/proyecto/' + p.id + '?tab=entrega');
        });
      } else {
        var tieneMentor = p.evaluaciones.some(function (e) { return e.rol === 'mentor' && e.decision === 'aprobado'; });
        var tieneEmpresa = p.evaluaciones.some(function (e) { return e.rol === 'empresa' && e.decision === 'aprobado'; });
        if (tieneMentor && tieneEmpresa) {
          p.estado = 'aprobado';
          coordinadores().forEach(function (c) {
            notificar(c.id, 'constancia', 'Proyecto listo para constancias',
              '“' + reto(p.retoId).titulo + '” fue aprobado por mentor y empresa.', '#/proyecto/' + p.id + '?tab=evaluacion');
          });
          p.estudianteIds.forEach(function (id) {
            notificar(id, 'evaluacion', '¡Tu proyecto fue aprobado!',
              'Mentor y empresa aprobaron la entrega. La coordinación emitirá tu constancia.', '#/proyecto/' + p.id);
          });
        } else {
          var falta = tieneMentor ? 'la empresa' : 'el mentor';
          p.estudianteIds.forEach(function (id) {
            notificar(id, 'evaluacion', 'Una evaluación registrada',
              'Falta la evaluación de ' + falta + ' para cerrar el proyecto.', '#/proyecto/' + p.id + '?tab=evaluacion');
          });
        }
      }
    });
    return { ok: true };
  }

  /* ================= Constancias ================= */
  function generarCodigo() {
    var codigo, intentos = 0;
    do {
      codigo = 'UTL-' + new Date().getFullYear() + '-' + U.bloqueCodigo(4) + '-' + U.bloqueCodigo(4);
      intentos++;
    } while (constanciaPorCodigo(codigo) && intentos < 8);
    return codigo;
  }

  function emitirConstancias(proyectoId) {
    var p = proyecto(proyectoId); if (!p) return { ok: false, error: 'Proyecto no encontrado.' };
    if (p.estado !== 'aprobado')
      return { ok: false, error: 'Solo se emiten constancias de proyectos aprobados por el mentor y la empresa.' };
    var u = Auth.actual();
    var r = reto(p.retoId);
    var emitidas = [];

    Store.tx(function () {
      p.estudianteIds.forEach(function (id) {
        if (constanciasDe(id).some(function (c) { return c.proyectoId === p.id; })) return;
        var est = usuario(id);
        var habs = U.unique((r.habilidadesRequeridas || []).map(function (h) { return h.skill; })
          .filter(function (s) { return (est.habilidades || []).some(function (x) { return x.skill === s; }); })
          .concat((est.habilidades || []).map(function (x) { return x.skill; })
            .filter(function (s) { return (r.habilidadesDeseables || []).indexOf(s) !== -1; })))
          .map(habilidadNombre);
        if (!habs.length) habs = (r.habilidadesRequeridas || []).map(function (h) { return habilidadNombre(h.skill); });

        var c = {
          id: U.uid('c'), codigo: generarCodigo(), proyectoId: p.id, estudianteId: id,
          emitidaAt: U.hoy(), emitidaPorId: u ? u.id : null, estado: 'vigente',
          snapshot: {
            estudiante: est.nombre, codigoUPN: est.codigoUPN, carrera: est.carrera,
            reto: r.titulo, empresa: empresaNombre(r.empresaId),
            mentor: nombre(p.mentorId), coordinador: u ? u.nombre : 'Coordinación UPN',
            rol: p.liderId === id ? 'Líder de equipo' : 'Integrante',
            inicio: p.inicio, fin: p.fin, semanas: p.semanas,
            horas: horasProyecto(p, null) ? Math.round(horasProyecto(p) ) : r.horasSemana * p.semanas,
            puntaje: puntajeProyecto(p) || 0, categoria: r.categoria,
            habilidades: habs,
            logro: (p.entregaFinal && p.entregaFinal.resumen) ? U.truncar(p.entregaFinal.resumen, 240) : r.resultado
          }
        };
        Store.get().constancias.push(c);
        emitidas.push(c);

        est.portafolio = est.portafolio || [];
        est.portafolio.push({
          id: U.uid('pf'), constanciaId: c.id, proyectoId: p.id,
          titulo: r.titulo, empresa: c.snapshot.empresa, rol: c.snapshot.rol,
          relato: c.snapshot.logro, habilidades: c.snapshot.habilidades, visible: true,
          enlaces: [{ label: 'Verificar constancia', url: '#/verificar/' + c.codigo }]
        });

        notificar(id, 'constancia', 'Constancia emitida',
          'Ya puedes descargar tu constancia verificable del proyecto con ' + c.snapshot.empresa + '.',
          '#/constancia/' + c.codigo);
      });

      p.estado = 'cerrado';
      r.estado = 'finalizado';
      r.historial.push({ estado: 'finalizado', at: new Date().toISOString(), por: u ? u.id : null, nota: 'Constancias emitidas' });
      Store.auditar('constancia:emitir', 'proyecto', p.id, { cantidad: emitidas.length });
      notificar(p.empresaId, 'proyecto', 'Microproyecto cerrado',
        'El proyecto “' + r.titulo + '” se cerró formalmente. ¡Gracias por participar!', '#/proyecto/' + p.id);
      notificar(p.mentorId, 'proyecto', 'Microproyecto cerrado',
        'Se emitieron las constancias de “' + r.titulo + '”.', '#/proyecto/' + p.id);
    });

    return { ok: true, constancias: emitidas };
  }

  function anularConstancia(id, motivo) {
    var c = Store.find('constancias', id);
    if (!c) return { ok: false, error: 'Constancia no encontrada.' };
    if (!String(motivo || '').trim()) return { ok: false, error: 'Indica el motivo de la anulación.' };
    Store.tx(function () {
      c.estado = 'anulada'; c.motivoAnulacion = String(motivo).trim(); c.anuladaAt = U.hoy();
      var est = usuario(c.estudianteId);
      if (est && est.portafolio) est.portafolio = est.portafolio.filter(function (pf) { return pf.constanciaId !== c.id; });
      Store.auditar('constancia:anular', 'constancia', c.id, { motivo: motivo });
      notificar(c.estudianteId, 'constancia', 'Constancia anulada', String(motivo).trim(), '#/mis-constancias');
    });
    return { ok: true };
  }

  function verificar(codigo) {
    var c = constanciaPorCodigo(codigo);
    if (!c) return { encontrada: false };
    return { encontrada: true, constancia: c, vigente: c.estado === 'vigente' };
  }

  /* ================= Métricas ================= */
  function metricas() {
    var proyectosT = Store.all('proyectos');
    var cerrados = proyectosT.filter(function (p) { return p.estado === 'cerrado'; });
    var horas = U.sum(cerrados, function (p) { return horasProyecto(p) * p.estudianteIds.length; });
    var evs = [];
    proyectosT.forEach(function (p) { (p.evaluaciones || []).forEach(function (e) { evs.push(puntajeEval(e)); }); });
    return {
      empresas: empresas().length,
      estudiantes: estudiantes().length,
      retosPublicados: Store.where('retos', function (r) { return r.estado === 'publicado'; }).length,
      retosTotales: Store.all('retos').length,
      proyectosActivos: proyectosT.filter(function (p) { return ['en_curso', 'en_validacion'].indexOf(p.estado) !== -1; }).length,
      proyectosCerrados: cerrados.length,
      constancias: Store.where('constancias', function (c) { return c.estado === 'vigente'; }).length,
      horas: horas,
      satisfaccion: evs.length ? Math.round(U.sum(evs) / evs.length) : null
    };
  }

  return {
    usuario: usuario, nombre: nombre, empresaNombre: empresaNombre, reto: reto, proyecto: proyecto,
    habilidadNombre: habilidadNombre, categoria: categoria,
    estudiantes: estudiantes, empresas: empresas, mentores: mentores, coordinadores: coordinadores,
    proyectoDeReto: proyectoDeReto, postulacionesDe: postulacionesDe, postulacionDe: postulacionDe,
    proyectosDe: proyectosDe, constanciasDe: constanciasDe, constanciaPorCodigo: constanciaPorCodigo,
    cargaMentor: cargaMentor, tieneProyectoActivo: tieneProyectoActivo,
    proyectosCompletados: proyectosCompletados, ratingEstudiante: ratingEstudiante,
    puntajeEval: puntajeEval, puntajeProyecto: puntajeProyecto,
    progreso: progreso, semanaActual: semanaActual, horasProyecto: horasProyecto,
    notificar: notificar, notificacionesDe: notificacionesDe, noLeidas: noLeidas, marcarLeidas: marcarLeidas,
    crearReto: crearReto, transicionReto: transicionReto, transicionesPosibles: transicionesPosibles,
    postular: postular, retirarPostulacion: retirarPostulacion, decidirPostulacion: decidirPostulacion,
    conformarEquipo: conformarEquipo, entregarHito: entregarHito, revisarHito: revisarHito,
    agregarBitacora: agregarBitacora, entregaFinal: entregaFinal, evaluar: evaluar,
    emitirConstancias: emitirConstancias, anularConstancia: anularConstancia, verificar: verificar,
    metricas: metricas
  };

/* 06-matching.js — Compatibilidad estudiante ↔ reto, armado de equipo y sugerencia de mentor.
   Funciones puras: reciben los objetos, no leen estado oculto. */
window.Matching = (function () {
  var W = CFG.PESOS_MATCH;

  function nivelDe(est, skill) {
    var h = (est.habilidades || []).filter(function (x) { return x.skill === skill; })[0];
    return h ? h.nivel : 0;
  }

  /* ---- Filtros duros: descartan al candidato con un motivo legible ---- */
  function filtroDuro(est, reto) {
    var criticas = (reto.habilidadesRequeridas || []).filter(function (h) { return h.peso === 3; });
    var faltantes = criticas.filter(function (h) { return nivelDe(est, h.skill) < h.nivelMin; });
    if (faltantes.length) {
      return { ok: false, motivo: 'No cumple el requisito indispensable: ' +
        faltantes.map(function (h) { return M.habilidadNombre(h.skill) + ' (nivel ' + h.nivelMin + '+)'; }).join(', ') };
    }
    var minHoras = Math.ceil((reto.horasSemana || 10) * 0.7);
    if ((est.horasSemana || 0) < minHoras) {
      return { ok: false, motivo: 'Declara ' + (est.horasSemana || 0) + ' h/semana y el reto necesita al menos ' + minHoras + ' h.' };
    }
    if (reto.modalidad !== 'remoto' && est.modalidad === 'remoto' && reto.modalidad === 'presencial') {
      return { ok: false, motivo: 'El reto es presencial y el estudiante solo tiene disponibilidad remota.' };
    }
    return { ok: true };
  }

  /* ---- Puntaje 0–100 con desglose explicable ---- */
  function evaluar(est, reto) {
    if (!est || !reto) return { total: 0, banda: 'baja', desglose: [], descartado: true, motivo: 'Datos incompletos.' };

    var duro = filtroDuro(est, reto);
    var req = reto.habilidadesRequeridas || [];
    var pesoTotal = U.sum(req, function (h) { return h.peso; }) || 1;
    var desglose = [];

    /* A. Cobertura de habilidades requeridas */
    var cubiertas = req.filter(function (h) { return nivelDe(est, h.skill) > 0; });
    var pCob = U.sum(cubiertas, function (h) { return h.peso; }) / pesoTotal;
    desglose.push({
      id: 'cobertura', label: 'Habilidades requeridas', max: W.cobertura,
      puntos: pCob * W.cobertura,
      detalle: cubiertas.length + ' de ' + req.length + ' habilidades pedidas' +
        (cubiertas.length ? ': ' + cubiertas.map(function (h) { return M.habilidadNombre(h.skill); }).join(', ') : '')
    });

    /* B. Profundidad de nivel */
    var pNivel = U.sum(req, function (h) {
      return h.peso * Math.min(1, nivelDe(est, h.skill) / (h.nivelMin || 1));
    }) / pesoTotal;
    desglose.push({
      id: 'nivel', label: 'Nivel declarado', max: W.nivel, puntos: pNivel * W.nivel,
      detalle: pNivel >= 0.99 ? 'Alcanza o supera el nivel pedido en todas' :
               (pNivel >= 0.7 ? 'Cerca del nivel pedido' : 'Por debajo del nivel pedido en varias')
    });

    /* C. Disponibilidad horaria */
    var need = reto.horasSemana || 10;
    var ratio = Math.min(1, (est.horasSemana || 0) / need);
    desglose.push({
      id: 'disponibilidad', label: 'Disponibilidad', max: W.disponibilidad, puntos: ratio * W.disponibilidad,
      detalle: (est.horasSemana || 0) + ' h/semana disponibles frente a ' + need + ' h requeridas'
    });

    /* D. Afinidad carrera / intereses */
    var afines = CFG.CARRERAS[est.carrera] || [];
    var intereses = est.intereses || [];
    var pAfin = 0, detAfin = 'Sin relación directa con su carrera';
    if (intereses.indexOf(reto.categoria) !== -1) { pAfin = 1; detAfin = 'Es un área que declaró como interés'; }
    else if (afines.indexOf(reto.categoria) !== -1) { pAfin = 0.7; detAfin = 'Su carrera (' + est.carrera + ') se relaciona con el área'; }
    else if (afines.length && afines.indexOf(reto.categoria) === -1 && cubiertas.length) { pAfin = 0.3; detAfin = 'Tiene habilidades del área aunque su carrera es otra'; }
    desglose.push({ id: 'afinidad', label: 'Afinidad con el área', max: W.afinidad, puntos: pAfin * W.afinidad, detalle: detAfin });

    /* E. Ciclo académico */
    var complejidad = (reto.semanas || 3) + (req.filter(function (h) { return h.peso === 3; }).length);
    var idealMin = complejidad >= 7 ? 6 : 4;
    var ciclo = est.ciclo || 1;
    var pCiclo = ciclo >= idealMin ? 1 : (ciclo >= idealMin - 1 ? 0.65 : 0.25);
    desglose.push({
      id: 'ciclo', label: 'Ciclo académico', max: W.ciclo, puntos: pCiclo * W.ciclo,
      detalle: 'Ciclo ' + ciclo + (pCiclo === 1 ? ' — adecuado para la complejidad del reto' : ' — algo temprano para este reto')
    });

    /* F. Modalidad y ubicación */
    var pMod = 0, detMod = 'Modalidad distinta a la del reto';
    if (est.modalidad === reto.modalidad) { pMod = 1; detMod = 'Coincide la modalidad (' + CFG.MODALIDADES[reto.modalidad] + ')'; }
    else if (est.modalidad === 'hibrido' || reto.modalidad === 'remoto') { pMod = 0.7; detMod = 'Modalidad compatible'; }
    desglose.push({ id: 'modalidad', label: 'Modalidad', max: W.modalidad, puntos: pMod * W.modalidad, detalle: detMod });

    /* G. Desempeño histórico */
    var rating = M.ratingEstudiante(est.id);
    var completados = M.proyectosCompletados(est.id).length;
    var pHist = rating === null ? 0.5 : U.clamp(rating / 100, 0, 1);
    var bonoExp = Math.min(0.2, completados * 0.1);
    desglose.push({
      id: 'historial', label: 'Desempeño previo', max: W.historial,
      puntos: Math.min(1, pHist + bonoExp) * W.historial,
      detalle: rating === null ? 'Primera participación en Talent Lab' :
        (completados + ' ' + U.plural(completados, 'proyecto') + ' cerrado' + (completados === 1 ? '' : 's') + ' · promedio ' + rating + '/100')
    });

    /* H. Habilidades deseables */
    var des = reto.habilidadesDeseables || [];
    var desTiene = des.filter(function (s) { return nivelDe(est, s) > 0; });
    var pDes = des.length ? desTiene.length / des.length : 0.5;
    desglose.push({
      id: 'deseables', label: 'Habilidades deseables', max: W.deseables, puntos: pDes * W.deseables,
      detalle: des.length ? (desTiene.length + ' de ' + des.length + ' habilidades deseables') : 'El reto no pidió habilidades adicionales'
    });

    var total = U.sum(desglose, function (x) { return x.puntos; });

    /* Ajustes de equidad y compromiso */
    var ajustes = [];
    if (completados === 0) { total += 4; ajustes.push({ txt: 'Primera oportunidad en el programa', v: 4 }); }
    if (completados >= 2) { total -= 8; ajustes.push({ txt: 'Ya participó en 2 o más microproyectos', v: -8 }); }
    if (M.tieneProyectoActivo(est.id)) { total -= 25; ajustes.push({ txt: 'Tiene un microproyecto en curso', v: -25 }); }

    total = Math.round(U.clamp(total, 0, 100));

    return {
      total: duro.ok ? total : 0,
      descartado: !duro.ok,
      motivo: duro.ok ? '' : duro.motivo,
      banda: banda(duro.ok ? total : 0),
      desglose: desglose,
      ajustes: ajustes,
      faltantes: req.filter(function (h) { return nivelDe(est, h.skill) === 0; }).map(function (h) { return h.skill; })
    };
  }

  function banda(t) {
    if (t >= 80) return 'excelente';
    if (t >= 65) return 'buena';
    if (t >= 50) return 'aceptable';
    return 'baja';
  }
  var BANDAS = {
    excelente: { label: 'Compatibilidad excelente', clase: 'match--verde', chip: 'chip--ok' },
    buena:     { label: 'Buena compatibilidad',     clase: '',             chip: 'chip--brand' },
    aceptable: { label: 'Compatibilidad aceptable', clase: '',             chip: 'chip--warn' },
    baja:      { label: 'Compatibilidad baja',      clase: 'match--gris',  chip: '' }
  };

  /* ---- Ranking de postulantes de un reto ---- */
  function rankearPostulantes(retoId) {
    var r = M.reto(retoId);
    return U.sortBy(M.postulacionesDe(retoId).map(function (p) {
      var est = M.usuario(p.estudianteId);
      var res = evaluar(est, r);
      return { postulacion: p, estudiante: est, match: res };
    }), function (x) { return x.match.total; }, true);
  }

  /* ---- Retos recomendados para un estudiante ---- */
  function retosPara(estudianteId) {
    var est = M.usuario(estudianteId);
    return U.sortBy(Store.where('retos', function (r) { return r.estado === 'publicado'; }).map(function (r) {
      return { reto: r, match: evaluar(est, r) };
    }), function (x) { return x.match.total; }, true);
  }

  /* ---- Estudiantes candidatos (postulen o no) ---- */
  function candidatos(retoId) {
    var r = M.reto(retoId);
    return U.sortBy(M.estudiantes().map(function (est) {
      return { estudiante: est, match: evaluar(est, r), postulacion: M.postulacionDe(retoId, est.id) };
    }), function (x) { return x.match.total; }, true);
  }

  /* ---- Cobertura de habilidades de un conjunto de estudiantes ---- */
  function cobertura(retoId, estudianteIds) {
    var r = M.reto(retoId);
    var req = r.habilidadesRequeridas || [];
    var pesoTotal = U.sum(req, function (h) { return h.peso; }) || 1;
    var cubiertas = [], faltantes = [];
    req.forEach(function (h) {
      var alguien = estudianteIds.some(function (id) {
        var e = M.usuario(id);
        return e && nivelDe(e, h.skill) >= h.nivelMin;
      });
      (alguien ? cubiertas : faltantes).push(h);
    });
    return {
      pct: Math.round((U.sum(cubiertas, function (h) { return h.peso; }) / pesoTotal) * 100),
      cubiertas: cubiertas.map(function (h) { return h.skill; }),
      faltantes: faltantes.map(function (h) { return h.skill; })
    };
  }

  /* ---- Sugerencia de equipo: mejor puntaje + cobertura complementaria ---- */
  function sugerirEquipo(retoId, tamano) {
    var r = M.reto(retoId);
    tamano = tamano || r.tamanoEquipo || 2;
    var pool = rankearPostulantes(retoId).filter(function (x) {
      return !x.match.descartado && x.postulacion.estado !== 'no_seleccionada' && !M.tieneProyectoActivo(x.estudiante.id);
    });
    if (!pool.length) return { ids: [], cobertura: cobertura(retoId, []), pool: [] };

    var elegidos = [pool[0].estudiante.id];
    while (elegidos.length < tamano && elegidos.length < pool.length) {
      var base = cobertura(retoId, elegidos).pct;
      var mejor = null, mejorScore = -1;
      pool.forEach(function (c) {
        if (elegidos.indexOf(c.estudiante.id) !== -1) return;
        var ganancia = cobertura(retoId, elegidos.concat([c.estudiante.id])).pct - base;
        var score = 0.6 * c.match.total + 0.4 * (ganancia * 2);
        if (score > mejorScore) { mejorScore = score; mejor = c; }
      });
      if (!mejor) break;
      elegidos.push(mejor.estudiante.id);
    }
    return { ids: elegidos, cobertura: cobertura(retoId, elegidos), pool: pool };
  }

  /* ---- Sugerencia de mentor ---- */
  function sugerirMentores(retoId) {
    var r = M.reto(retoId);
    var req = (r.habilidadesRequeridas || []).map(function (h) { return h.skill; });
    return U.sortBy(M.mentores().map(function (m) {
      var coincide = req.filter(function (s) { return (m.habilidades || []).indexOf(s) !== -1; });
      var carga = M.cargaMentor(m.id);
      var max = m.maxProyectos || 3;
      var disponible = carga < max;
      var score = Math.round(
        60 * (req.length ? coincide.length / req.length : 0.5) +
        40 * (1 - carga / max)
      );
      return {
        mentor: m, score: disponible ? score : 0, disponible: disponible, carga: carga, max: max,
        coincidencias: coincide.map(M.habilidadNombre)
      };
    }), function (x) { return x.score; }, true);
  }

  return {
    evaluar: evaluar, filtroDuro: filtroDuro, banda: banda, BANDAS: BANDAS,
    rankearPostulantes: rankearPostulantes, retosPara: retosPara, candidatos: candidatos,
    cobertura: cobertura, sugerirEquipo: sugerirEquipo, sugerirMentores: sugerirMentores,
    nivelDe: nivelDe
  };
})();

/* 07-ui.js — Toasts, modales y utilidades de interfaz */
window.UI = (function () {
  var ultimoFoco = null;

  function toast(mensaje, tipo, ms) {
    var cont = document.getElementById('toasts');
    if (!cont) return;
    var el = document.createElement('div');
    el.className = 'toast' + (tipo ? ' toast--' + tipo : '');
    el.textContent = mensaje;
    cont.appendChild(el);
    setTimeout(function () {
      el.style.opacity = '0';
      el.style.transition = 'opacity .25s';
      setTimeout(function () { el.remove(); }, 260);
    }, ms || 3600);
  }

  function abrirModal(titulo, contenidoHtml) {
    var m = document.getElementById('modal');
    document.getElementById('modal-titulo').textContent = titulo;
    document.getElementById('modal-cuerpo').innerHTML = U.str(contenidoHtml);
    ultimoFoco = document.activeElement;
    m.hidden = false;
    document.body.style.overflow = 'hidden';
    var f = m.querySelector('input,select,textarea,button:not([data-action="ui:cerrar-modal"])');
    if (f) setTimeout(function () { f.focus(); }, 60);
  }

  function cerrarModal() {
    var m = document.getElementById('modal');
    if (!m || m.hidden) return;
    m.hidden = true;
    document.getElementById('modal-cuerpo').innerHTML = '';
    document.body.style.overflow = '';
    if (ultimoFoco && ultimoFoco.focus) ultimoFoco.focus();
    ultimoFoco = null;
  }

  function modalAbierto() { var m = document.getElementById('modal'); return m && !m.hidden; }

  /* Trampa de foco dentro del modal */
  function atraparFoco(e) {
    if (!modalAbierto() || e.key !== 'Tab') return;
    var box = document.querySelector('.modal__box');
    var f = box.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])');
    if (!f.length) return;
    var primero = f[0], ultimo = f[f.length - 1];
    if (e.shiftKey && document.activeElement === primero) { e.preventDefault(); ultimo.focus(); }
    else if (!e.shiftKey && document.activeElement === ultimo) { e.preventDefault(); primero.focus(); }
  }

  function abrirMenu() {
    document.getElementById('sidebar').classList.add('is-open');
    document.getElementById('scrim').hidden = false;
    document.body.style.overflow = 'hidden';
  }
  function cerrarMenu() {
    document.getElementById('sidebar').classList.remove('is-open');
    document.getElementById('scrim').hidden = true;
    if (!modalAbierto()) document.body.style.overflow = '';
  }

  function tema(nuevo) {
    var t = nuevo || Store.lsGet(CFG.KEY_TEMA) || 'auto';
    if (t === 'auto') document.documentElement.removeAttribute('data-tema');
    else document.documentElement.setAttribute('data-tema', t);
    if (nuevo) Store.lsSet(CFG.KEY_TEMA, t);
    return t;
  }
  function temaActual() { return Store.lsGet(CFG.KEY_TEMA) || 'auto'; }

  function copiar(texto) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texto).then(function () { toast('Copiado al portapapeles', 'ok'); },
        function () { toast('No se pudo copiar', 'err'); });
    } else {
      var ta = document.createElement('textarea');
      ta.value = texto; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('Copiado al portapapeles', 'ok'); }
      catch (e) { toast('No se pudo copiar', 'err'); }
      ta.remove();
    }
  }

  return {
    toast: toast, abrirModal: abrirModal, cerrarModal: cerrarModal, modalAbierto: modalAbierto,
    atraparFoco: atraparFoco, abrirMenu: abrirMenu, cerrarMenu: cerrarMenu,
    tema: tema, temaActual: temaActual, copiar: copiar
  };
})();

    ajustes: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
    mas: '<path d="M12 5v14M5 12h14"/>',
    lupa: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
    volver: '<path d="M15 18l-6-6 6-6"/>',
    reloj: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    edificio: '<path d="M4 21V6a1 1 0 0 1 1-1h6v16"/><path d="M11 10h8a1 1 0 0 1 1 1v10"/><path d="M7 9h1M7 13h1M7 17h1M15 14h1M15 18h1"/>',
    doc: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
    salir: '<path d="M10 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/><path d="M16 17l5-5-5-5M21 12H9"/>',
    imprimir: '<path d="M6 9V3h12v6"/><rect x="4" y="9" width="16" height="7" rx="2"/><path d="M7 16h10v5H7z"/>',
    grafico: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'
  };
  function icono(n, size) {
    var p = PATHS[n] || PATHS.doc;
    return raw('<svg viewBox="0 0 24 24" width="' + (size || 20) + '" height="' + (size || 20) +
      '" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p + '</svg>');
  }

  /* ---------- Identidad ---------- */
  function avatar(user, clase) {
    if (!user) return h`<span class="avatar ${clase || ''}">?</span>`;
    if (user.rol === 'empresa' && user.logo) return h`<span class="avatar ${clase || ''}" aria-hidden="true">${user.logo}</span>`;
    return h`<span class="avatar ${clase || ''}" aria-hidden="true">${U.iniciales(user.nombre)}</span>`;
  }
  function persona(user, sub, clase) {
    if (!user) return h``;
    return h`<span class="persona">
      ${avatar(user, clase || 'avatar--sm')}
      <span style="min-width:0">
        <span class="persona__n">${user.rol === 'empresa' ? (user.razonSocial || user.nombre) : user.nombre}</span>
        ${sub ? h`<span class="persona__r">${sub}</span>` : ''}
      </span>
    </span>`;
  }
  function chipRol(rol) {
    var r = CFG.ROLES[rol]; if (!r) return h``;
    return h`<span class="chip chip--${r.color === 'brand' ? 'brand' : r.color}">${r.icono} ${r.label}</span>`;
  }

  /* ---------- Estados ---------- */
  function chipReto(reto) {
    var e = CFG.RETO_ESTADOS[reto.estado] || { label: reto.estado, chip: '' };
    return h`<span class="chip ${e.chip}">${e.label}</span>`;
  }
  function chipProyecto(p) {
    var e = CFG.PROYECTO_ESTADOS[p.estado] || { label: p.estado, chip: '' };
    return h`<span class="chip ${e.chip}">${e.label}</span>`;
  }
  function chipHito(hito) {
    var e = CFG.HITO_ESTADOS[hito.estado] || { label: hito.estado, chip: '' };
    return h`<span class="chip ${e.chip}">${e.label}</span>`;
  }
  function chipCategoria(cat) {
    var c = M.categoria(cat);
    return h`<span class="chip chip--brand">${c.icono} ${c.label}</span>`;
  }
  function chipsHabilidades(skills, max) {
    var lista = (skills || []).slice(0, max || 99);
    var resto = (skills || []).length - lista.length;
    return h`<span class="chips">
      ${lista.map(function (s) {
        var id = typeof s === 'string' ? s : s.skill;
        var extra = (typeof s === 'object' && s.nivelMin) ? ' · nivel ' + s.nivelMin + '+' : '';
        var critico = (typeof s === 'object' && s.peso === 3);
        return h`<span class="chip ${critico ? 'chip--dark' : ''}">${M.habilidadNombre(id)}${extra}</span>`;
      })}
      ${resto > 0 ? h`<span class="chip">+${resto}</span>` : ''}
    </span>`;
  }

  /* ---------- Progreso y match ---------- */
  function progreso(pct, ok) {
    return h`<div class="progress ${ok ? 'progress--ok' : ''}" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100">
      <div class="progress__bar" style="width:${U.clamp(pct, 0, 100)}%"></div>
    </div>`;
  }
  function medidor(pct, ok) {
    return h`<div class="meter">${progreso(pct, ok)}<b>${pct}%</b></div>`;
  }
  function anilloMatch(match, etiqueta) {
    var b = Matching.BANDAS[match.banda] || Matching.BANDAS.baja;
    return h`<span class="match ${b.clase}" title="${b.label}">
      <span class="match__ring" style="--p:${match.total}"><span>${match.total}</span></span>
      ${etiqueta ? h`<span class="tiny"><b>${b.label}</b></span>` : ''}
    </span>`;
  }
  function desgloseMatch(match) {
    return h`<ul class="breakdown">
      ${match.desglose.map(function (d) {
        return h`<li>
          <span><b>${d.label}</b><br><span class="muted tiny">${d.detalle}</span></span>
          <span class="nowrap"><b>${Math.round(d.puntos)}</b><span class="muted tiny">/${d.max}</span></span>
          ${progreso(Math.round((d.puntos / d.max) * 100))}
        </li>`;
      })}
      ${(match.ajustes || []).map(function (a) {
        return h`<li><span class="tiny ${a.v < 0 ? 'muted' : ''}">${a.v > 0 ? '➕' : '➖'} ${a.txt}</span><span class="tiny nowrap">${a.v > 0 ? '+' : ''}${a.v}</span></li>`;
      })}
    </ul>`;
  }
  function estrellas(n) {
    var full = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3 6.5 7 .9-5 4.8 1.2 7L12 17.8 5.8 21.2 7 14.2 2 9.4l7-.9z"/></svg>';
    var empty = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2l3 6.5 7 .9-5 4.8 1.2 7L12 17.8 5.8 21.2 7 14.2 2 9.4l7-.9z"/></svg>';
    var s = '';
    for (var i = 1; i <= 5; i++) s += (i <= n ? full : empty);
    return h`<span class="stars" aria-label="${n} de 5">${raw(s)}</span>`;
  }

  /* ---------- Contenedores ---------- */
  /* nivel: 'h1' cuando el estado vacío es la pantalla completa (404, sin permiso),
     'h3' (por defecto) cuando va dentro de una sección que ya tiene su encabezado. */
  function vacio(ico, titulo, texto, cta, nivel) {
    var t = nivel === 'h1' ? 'h1' : 'h3';
    return h`<div class="empty">
      <div class="empty__ico" aria-hidden="true">${ico}</div>
      ${raw('<' + t + '>' + U.esc(titulo) + '</' + t + '>')}
      <p>${texto}</p>
      ${cta || ''}
    </div>`;
  }
  function stat(k, v, d, brand) {
    return h`<div class="stat ${brand ? 'stat--brand' : ''}">
      <div class="stat__k">${k}</div>
      <div class="stat__v">${v}</div>
      ${d ? h`<div class="stat__d">${d}</div>` : ''}
    </div>`;
  }
  function aviso(tipo, ico, texto) {
    return h`<div class="notice notice--${tipo}"><span class="notice__ico" aria-hidden="true">${ico}</span><p>${texto}</p></div>`;
  }
  function volver(href, texto) {
    return h`<a class="btn btn--ghost btn--sm no-print" href="${href}">${icono('volver', 16)} ${texto || 'Volver'}</a>`;
  }
  function pageHead(titulo, sub, acciones) {
    return h`<div class="page-head">
      <div class="page-head__txt"><h1>${titulo}</h1>${sub ? h`<p>${sub}</p>` : ''}</div>
      ${acciones ? h`<div class="page-head__actions">${acciones}</div>` : ''}
    </div>`;
  }

  /* ---------- Formularios ---------- */
  function campo(o) {
    var id = o.id || ('f_' + o.name);
    var comun = 'id="' + U.esc(id) + '" name="' + U.esc(o.name) + '"' +
      (o.required ? ' required' : '') + (o.placeholder ? ' placeholder="' + U.esc(o.placeholder) + '"' : '') +
      (o.min !== undefined ? ' min="' + U.esc(o.min) + '"' : '') + (o.max !== undefined ? ' max="' + U.esc(o.max) + '"' : '') +
      (o.maxlength ? ' maxlength="' + U.esc(o.maxlength) + '"' : '') +
      (o.disabled ? ' disabled' : '');
    var control;
    if (o.tipo === 'textarea') {
      control = raw('<textarea class="textarea" ' + comun + (o.rows ? ' rows="' + o.rows + '"' : '') + '>' + U.esc(o.valor || '') + '</textarea>');
    } else if (o.tipo === 'select') {
      control = h`<select class="select" ${raw(comun)}>
        ${o.vacio ? h`<option value="">${o.vacio}</option>` : ''}
        ${(o.opciones || []).map(function (op) {
          var val = op.value !== undefined ? op.value : op;
          var lab = op.label !== undefined ? op.label : op;
          return raw('<option value="' + U.esc(val) + '"' + (String(o.valor) === String(val) ? ' selected' : '') + '>' + U.esc(lab) + '</option>');
        })}
      </select>`;
    } else {
      control = raw('<input class="input" type="' + U.esc(o.tipo || 'text') + '" ' + comun +
        ' value="' + U.esc(o.valor === undefined || o.valor === null ? '' : o.valor) + '">');
    }
    return h`<div class="field">
      <label for="${id}">${o.label}${o.required ? raw(' <span aria-hidden="true" style="color:var(--danger)">*</span>') : ''}</label>
      ${control}
      ${o.ayuda ? h`<p class="field__hint">${o.ayuda}</p>` : ''}
    </div>`;
  }

  function checkHabilidades(name, seleccionadas, categoriasFiltro) {
    seleccionadas = seleccionadas || [];
    var ids = Object.keys(CFG.HABILIDADES).filter(function (k) {
      return !categoriasFiltro || categoriasFiltro.indexOf(CFG.HABILIDADES[k].categoria) !== -1;
    });
    return h`<div class="checkgrid checkgrid--3">
      ${ids.map(function (k) {
        var on = seleccionadas.indexOf(k) !== -1;
        return raw('<label class="checkline' + (on ? ' checkline--on' : '') + '">' +
          '<input type="checkbox" name="' + U.esc(name) + '[]" value="' + U.esc(k) + '"' + (on ? ' checked' : '') + '>' +
          '<span>' + U.esc(CFG.HABILIDADES[k].nombre) + '</span></label>');
      })}
    </div>`;
  }

  function selectorEstrellas(name, valor) {
    return h`<div class="starpick" role="radiogroup">
      ${[1, 2, 3, 4, 5].map(function (n) {
        return raw('<input type="radio" id="' + U.esc(name + n) + '" name="' + U.esc(name) + '" value="' + n + '"' +
          (String(valor) === String(n) ? ' checked' : '') + '>' +
          '<label for="' + U.esc(name + n) + '" title="' + n + ' de 5">' + n + '</label>');
      })}
    </div>`;
  }

  /* ---------- Tarjeta de reto ---------- */
  function cardReto(r, opts) {
    opts = opts || {};
    var emp = M.usuario(r.empresaId);
    var m = opts.match;
    var post = M.postulacionesDe(r.id).length;
    return h`<a class="card card--link" href="#/reto/${r.id}">
      <div class="card__head">
        ${avatar(emp)}
        <div class="hcol">
          <h3 class="card__title">${r.titulo}</h3>
          <p class="tiny muted mb0">${emp ? (emp.razonSocial || emp.nombre) : ''} · ${emp ? emp.distrito : ''}</p>
        </div>
        ${m ? anilloMatch(m) : chipReto(r)}
      </div>
      <p class="small muted">${U.truncar(r.problema, 130)}</p>
      <div class="chips">
        ${chipCategoria(r.categoria)}
        <span class="chip">${icono('reloj', 13)} ${r.semanas} semanas</span>
        <span class="chip">${r.tamanoEquipo} ${U.plural(r.tamanoEquipo, 'vacante')}</span>
        <span class="chip">${CFG.MODALIDADES[r.modalidad]}</span>
      </div>
      <div class="card__foot">
        <span class="tiny muted">${chipsHabilidades((r.habilidadesRequeridas || []).map(function (x) { return x.skill; }), 3)}</span>
        ${opts.mostrarPostulantes !== false && post ? h`<span class="tiny muted nowrap">${post} ${U.plural(post, 'postulante')}</span>` : ''}
      </div>
    </a>`;
  }

  /* ---------- Tarjeta de proyecto ---------- */
  function cardProyecto(p) {
    var r = M.reto(p.retoId);
    var pct = M.progreso(p);
    return h`<a class="card card--link" href="#/proyecto/${p.id}">
      <div class="card__head">
        <div class="hcol">
          <p class="tiny muted mb0">${p.codigo}</p>
          <h3 class="card__title">${r ? r.titulo : 'Proyecto'}</h3>
          <p class="tiny muted mb0">${M.empresaNombre(p.empresaId)}</p>
        </div>
        ${chipProyecto(p)}
      </div>
      ${medidor(pct, p.estado === 'cerrado')}
      <div class="card__foot">
        <span class="avatar-stack">${(p.estudianteIds || []).map(function (id) { return avatar(M.usuario(id), 'avatar--sm'); })}</span>
        <span class="tiny muted">${U.fecha(p.inicio)} → ${U.fecha(p.fin)}</span>
      </div>
    </a>`;
  }

  return {
    icono: icono, avatar: avatar, persona: persona, chipRol: chipRol,
    chipReto: chipReto, chipProyecto: chipProyecto, chipHito: chipHito,
    chipCategoria: chipCategoria, chipsHabilidades: chipsHabilidades,
    progreso: progreso, medidor: medidor, anilloMatch: anilloMatch, desgloseMatch: desgloseMatch,
    estrellas: estrellas, vacio: vacio, stat: stat, aviso: aviso, volver: volver, pageHead: pageHead,
    campo: campo, checkHabilidades: checkHabilidades, selectorEstrellas: selectorEstrellas,
    cardReto: cardReto, cardProyecto: cardProyecto
  };
})();

/* ===== assets/js/09-router.js ===== */
/* 09-router.js — Router por hash, guards por rol y render de la navegación */
window.Router = (function () {
  var rutas = [];
  var actual = null;

  function add(patron, cfg) {
    var partes = patron.split('/').filter(Boolean);
    rutas.push({ patron: patron, partes: partes, cfg: cfg });
  }

  function parseHash() {
    var hash = location.hash.replace(/^#/, '') || '/';
    var qi = hash.indexOf('?');
    var path = qi === -1 ? hash : hash.slice(0, qi);
    var qs = qi === -1 ? '' : hash.slice(qi + 1);
    var query = {};
    qs.split('&').filter(Boolean).forEach(function (par) {
      var kv = par.split('=');
      query[decodeURIComponent(kv[0])] = decodeURIComponent((kv[1] || '').replace(/\+/g, ' '));
    });
    if (path.charAt(0) !== '/') path = '/' + path;
    return { path: path, query: query };
  }

  function match(path) {
    var segs = path.split('/').filter(Boolean);
    for (var i = 0; i < rutas.length; i++) {
      var r = rutas[i];
      if (r.partes.length !== segs.length) continue;
      var params = {}, ok = true;
      for (var j = 0; j < r.partes.length; j++) {
        var p = r.partes[j];
        if (p.charAt(0) === ':') params[p.slice(1)] = decodeURIComponent(segs[j]);
        else if (p !== segs[j]) { ok = false; break; }
      }
      if (ok) return { ruta: r, params: params };
    }
    return null;
  }

  function go(hash) {
    if (location.hash === hash || location.hash === '#' + hash) render();
    else location.hash = hash;
  }
  function setQuery(cambios) {
    var s = parseHash();
    Object.keys(cambios).forEach(function (k) {
      if (cambios[k] === null || cambios[k] === '') delete s.query[k];
      else s.query[k] = cambios[k];
    });
    var qs = Object.keys(s.query).map(function (k) {
      return encodeURIComponent(k) + '=' + encodeURIComponent(s.query[k]);
    }).join('&');
    location.hash = '#' + s.path + (qs ? '?' + qs : '');
  }
  function params() { return actual ? actual : { path: '/', query: {}, params: {} }; }
  function refresh() { render(); }

  /* ---------------- Navegación por rol ---------------- */
  function navPara(rol) {
    var comun = [{ href: '#/notificaciones', icono: 'campana', label: 'Notificaciones', badge: true }];
    if (!rol) {
      return {
        principal: [
          { href: '#/', icono: 'inicio', label: 'Inicio', corto: 'Inicio' },
          { href: '#/retos', icono: 'retos', label: 'Retos abiertos', corto: 'Retos' },
          { href: '#/verificar', icono: 'escudo', label: 'Verificar constancia', corto: 'Verificar' },
          { href: '#/ayuda', icono: 'ayuda', label: 'Cómo funciona', corto: 'Ayuda' }
        ], secundaria: []
      };
    }
    if (rol === 'estudiante') return {
      principal: [
        { href: '#/', icono: 'inicio', label: 'Mi panel', corto: 'Panel' },
        { href: '#/retos', icono: 'brujula', label: 'Oportunidades', corto: 'Retos' },
        { href: '#/postulaciones', icono: 'doc', label: 'Mis postulaciones', corto: 'Postulé' },
        { href: '#/proyectos', icono: 'maletin', label: 'Mis proyectos', corto: 'Proyectos' },
        { href: '#/constancias', icono: 'medalla', label: 'Constancias', corto: 'Constancias' }
      ],
      secundaria: comun.concat([
        { href: '#/perfil', icono: 'usuario', label: 'Mi perfil y portafolio' },
        { href: '#/ayuda', icono: 'ayuda', label: 'Cómo funciona' }
      ])
    };
    if (rol === 'empresa') return {
      principal: [
        { href: '#/', icono: 'inicio', label: 'Mi panel', corto: 'Panel' },
        { href: '#/retos', icono: 'retos', label: 'Mis retos', corto: 'Retos' },
        { href: '#/reto/nuevo', icono: 'mas', label: 'Publicar reto', corto: 'Publicar' },
        { href: '#/proyectos', icono: 'maletin', label: 'Mis proyectos', corto: 'Proyectos' },
        { href: '#/talento', icono: 'personas', label: 'Talento UPN', corto: 'Talento' }
      ],
      secundaria: comun.concat([
        { href: '#/perfil', icono: 'edificio', label: 'Datos de la empresa' },
        { href: '#/ayuda', icono: 'ayuda', label: 'Cómo funciona' }
      ])
    };
    if (rol === 'mentor') return {
      principal: [
        { href: '#/', icono: 'inicio', label: 'Mi panel', corto: 'Panel' },
        { href: '#/proyectos', icono: 'maletin', label: 'Proyectos que acompaño', corto: 'Proyectos' },
        { href: '#/retos', icono: 'retos', label: 'Retos del programa', corto: 'Retos' },

      ],

      ])
    };
    return {

        { href: '#/', icono: 'inicio', label: 'Panel de coordinación', corto: 'Panel' },
        { href: '#/retos', icono: 'retos', label: 'Retos', corto: 'Retos' },
        { href: '#/proyectos', icono: 'maletin', label: 'Proyectos', corto: 'Proyectos' },
        { href: '#/talento', icono: 'personas', label: 'Talento', corto: 'Talento' },
        { href: '#/constancias', icono: 'medalla', label: 'Constancias', corto: 'Constancias' }
      ],
      secundaria: comun.concat([
        { href: '#/reportes', icono: 'grafico', label: 'Reportes' },
        { href: '#/perfil', icono: 'usuario', label: 'Mi perfil' },
        { href: '#/ayuda', icono: 'ayuda', label: 'Cómo funciona' }
      ])
    };
  }

  function pintarNav(pathActual) {
    var u = Auth.actual();
    var nav = navPara(u ? u.rol : null);
    var pendientes = u ? M.noLeidas(u.id) : 0;
    var h = U.html;

    function link(it, clase) {
      var activo = pathActual === it.href.replace('#', '') ||
                   (it.href !== '#/' && pathActual.indexOf(it.href.replace('#', '')) === 0);
      return h`<a class="${clase}" href="${it.href}" ${U.raw(activo ? 'aria-current="page"' : '')}>

      </a>`;
    }

    document.getElementById('nav-lateral').innerHTML = U.str(h`
      ${nav.principal.map(function (it) { return link(it, 'navlink'); })}
      ${nav.secundaria.length ? h`<div class="navgroup">Más</div>` : ''}
      ${nav.secundaria.map(function (it) { return link(it, 'navlink'); })}
    `);

    document.getElementById('nav-foot').innerHTML = U.str(u ? h`
      <a class="navlink" href="#/perfil" style="padding-left:.4rem">
        ${C.avatar(u)}<span style="min-width:0">
          <span style="display:block;font-weight:700;font-size:.86rem;overflow:hidden;text-overflow:ellipsis">${u.rol === 'empresa' ? (u.razonSocial || u.nombre) : u.nombre}</span>
          <span style="display:block;font-size:.75rem;color:#A8A29A">${CFG.ROLES[u.rol].label}</span>
        </span>
      </a>
      <button class="navlink" style="width:100%;background:none;border:0;cursor:pointer;text-align:left" data-action="auth:salir">
        ${C.icono('salir')}<span>Cerrar sesión</span>

    ` : h`
      <a class="btn btn--primary btn--block" href="#/ingresar">Ingresar</a>
      <a class="navlink mt-sm" href="#/registro" style="justify-content:center">Crear una cuenta</a>
    `);

    /* Barra inferior móvil: 5 accesos */
    var tabs = nav.principal.slice(0, 4).concat(u ? [{ href: '#/notificaciones', icono: 'campana', label: 'Avisos', corto: 'Avisos', badge: true }]
                                                  : [{ href: '#/ingresar', icono: 'usuario', label: 'Ingresar', corto: 'Ingresar' }]);
    document.getElementById('tabbar').innerHTML = U.str(h`${tabs.map(function (it) {
      var activo = pathActual === it.href.replace('#', '') ||
                   (it.href !== '#/' && pathActual.indexOf(it.href.replace('#', '')) === 0);
      return h`<a class="tablink" href="${it.href}" ${U.raw(activo ? 'aria-current="page"' : '')}>
        ${C.icono(it.icono, 22)}<span>${it.corto || it.label}</span>
        ${it.badge && pendientes ? h`<span class="tablink__dot"></span>` : ''}
      </a>`;
    })}`);

    /* Acciones de la topbar */
    document.getElementById('topbar-actions').innerHTML = U.str(h`
      <button class="iconbtn" data-action="ui:tema" title="Cambiar tema" aria-label="Cambiar tema claro u oscuro">
        ${C.icono(UI.temaActual() === 'oscuro' ? 'inicio' : 'ajustes', 20)}
      </button>
      ${u ? h`<a class="iconbtn" href="#/notificaciones" aria-label="Notificaciones${pendientes ? ': ' + pendientes + ' sin leer' : ''}">
          ${C.icono('campana', 21)}${pendientes ? h`<span class="iconbtn__dot">${pendientes}</span>` : ''}
        </a>
        <a class="iconbtn" href="#/perfil" aria-label="Mi perfil">${C.avatar(u, 'avatar--sm')}</a>`
        : h`<a class="btn btn--primary btn--sm" href="#/ingresar">Ingresar</a>`}
    `);
  }

  /* ---------------- Render ---------------- */
  function render() {
    var s = parseHash();
    var m = match(s.path);

    if (!m) {
      pintarNav(s.path);
      pintar(Vistas.noEncontrado(s.path), 'Página no encontrada');
      return;
    }

    var cfg = m.ruta.cfg;
    var u = Auth.actual();

    /* Guard: requiere sesión */
    if (cfg.roles && cfg.roles.indexOf('*') === -1) {
      if (!u) {
        location.hash = '#/ingresar?next=' + encodeURIComponent(s.path);
        return;
      }
      if (cfg.roles.indexOf(u.rol) === -1) {
        pintarNav(s.path);
        pintar(Vistas.sinPermiso(cfg.roles), 'Sin acceso');
        return;
      }
    }

    actual = { path: s.path, query: s.query, params: m.params };
    var shell = document.getElementById('app-shell');
    if (cfg.layout === 'print') shell.classList.add('layout-print');
    else shell.classList.remove('layout-print');

    pintarNav(s.path);
    var contenido;
    try {
      contenido = cfg.view(m.params, s.query);
    } catch (e) {
      console.error('Error al renderizar', s.path, e);
      contenido = C.aviso('danger', '⚠️', 'Ocurrió un error al mostrar esta pantalla. Prueba recargar la página.');
    }
    pintar(contenido, cfg.titulo);
  }

  function pintar(contenido, titulo) {
    var cont = document.getElementById('contenido');
    cont.innerHTML = U.str(contenido);
    document.title = (titulo ? titulo + ' · ' : '') + CFG.APP;
    UI.cerrarMenu();
    window.scrollTo(0, 0);
    var h1 = cont.querySelector('h1');
    if (h1) { h1.setAttribute('tabindex', '-1'); }
  }

  function start() {
    window.addEventListener('hashchange', render);
    render();
  }

  return { add: add, start: start, go: go, refresh: refresh, params: params, setQuery: setQuery, parseHash: parseHash, navPara: navPara };
})();

/* 11-views-empresa.js — Panel de empresa, catálogo de retos, detalle y formulario de reto */
window.Vistas = window.Vistas || {};
(function () {
